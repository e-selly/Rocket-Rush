<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #01030a;
      overflow: hidden;
    }
    #space-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #space-flash {
      position: absolute;
      inset: 0;
      background: #e8f4ff;
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <div id="root" data-composition-id="space" data-width="1080" data-height="1920" data-duration="35">
    <canvas id="space-canvas" width="1080" height="1920"></canvas>
    <div id="space-flash"></div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script>
    (function () {
      const W = 1080, H = 1920, DUR = 35, D2R = Math.PI / 180;
      const canvas = document.getElementById("space-canvas");
      const flashEl = document.getElementById("space-flash");

      // ---------- timing (video seconds) ----------
      const T_VANISH = 4.95;       // suit disappears after the question
      const T_VAPOR = 8.4;         // "Feuchtigkeit zu verdampfen"
      const T_THERMAL = 19.2;      // "Im Vakuum verliert dein Körper Wärme ..."

      // ---------- helpers ----------
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, u) => a + (b - a) * u;
      const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
      const easeIO = (u) => { u = clamp(u, 0, 1); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
      const lv = (a, b, u) => a.clone().lerp(b, u);
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // value noise shared by JS and GLSL (dissolve threshold)
      const fr = (x) => x - Math.floor(x);
      const h3 = (x, y, z) => fr(Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453);
      function vnoise(x, y, z) {
        const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
        let fx = x - ix, fy = y - iy, fz = z - iz;
        fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
        const L = (a, b, t) => a + (b - a) * t;
        return L(L(L(h3(ix, iy, iz), h3(ix + 1, iy, iz), fx), L(h3(ix, iy + 1, iz), h3(ix + 1, iy + 1, iz), fx), fy),
                 L(L(h3(ix, iy, iz + 1), h3(ix + 1, iy, iz + 1), fx), L(h3(ix, iy + 1, iz + 1), h3(ix + 1, iy + 1, iz + 1), fx), fy), fz);
      }
      const dissolveField = (x, y, z) => {
        const n = vnoise(x * 7, y * 7, z * 7) * 0.6 + vnoise(x * 15 + 3, y * 15, z * 15) * 0.4;
        const d = Math.sqrt(x * x + (y - 0.35) * (y - 0.35) + z * z);
        return n * 0.5 + clamp(d / 1.1, 0, 1) * 0.5;
      };
      const GLSL_NOISE = `
        float h3(vec3 p){ return fract(sin(p.x*12.9898 + p.y*78.233 + p.z*37.719) * 43758.5453); }
        float vnoise(vec3 x){
          vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
          return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x), f.y),
                     mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x), f.y), f.z);
        }
        float dissolveField(vec3 p){
          float n = vnoise(p*7.0)*0.6 + vnoise(p*15.0 + vec3(3.0,0.0,0.0))*0.4;
          float d = length(p - vec3(0.0, 0.35, 0.0));
          return n*0.5 + clamp(d/1.1, 0.0, 1.0)*0.5;
        }
      `;

      // ---------- renderer ----------
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x01030a, 1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.physicallyCorrectLights = true;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.02, 3000);

      // ---------- lights ----------
      const SUN_DIR = V3(-0.86, 0.32, -0.42).normalize();
      const sunLight = new THREE.DirectionalLight(0xfff3e2, 5.0);
      sunLight.position.copy(SUN_DIR).multiplyScalar(6);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.left = -1.4; sunLight.shadow.camera.right = 1.4;
      sunLight.shadow.camera.top = 1.6; sunLight.shadow.camera.bottom = -1.4;
      sunLight.shadow.camera.near = 1; sunLight.shadow.camera.far = 14;
      sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.02;
      scene.add(sunLight);
      const earthshine = new THREE.HemisphereLight(0x05070d, 0x2f5fa0, 0.55);
      scene.add(earthshine);
      const rim = new THREE.DirectionalLight(0x9fc4ff, 0.35);
      rim.position.set(1.2, 0.4, 2.0);
      scene.add(rim);

      // ---------- environment for reflections (procedural equirect: space + Earth below + sun) ----------
      function makeEnvTexture(earthImg) {
        const c = document.createElement("canvas"); c.width = 1024; c.height = 512;
        const g = c.getContext("2d");
        g.fillStyle = "#020409"; g.fillRect(0, 0, 1024, 512);
        const r = mulberry32(7);
        for (let i = 0; i < 900; i++) { const a = r(); g.fillStyle = `rgba(255,255,255,${0.2 + a * 0.8})`; g.fillRect(r() * 1024, r() * 300, 1, 1); }
        // Earth fills the lower part of the sky sphere
        g.save(); g.beginPath(); g.rect(0, 300, 1024, 212); g.clip();
        g.drawImage(earthImg, 0, 220, 1024, 380);
        g.fillStyle = "rgba(60,120,220,0.25)"; g.fillRect(0, 300, 1024, 212);
        g.restore();
        const grd = g.createLinearGradient(0, 285, 0, 320);
        grd.addColorStop(0, "rgba(90,160,255,0)"); grd.addColorStop(0.6, "rgba(120,190,255,0.9)"); grd.addColorStop(1, "rgba(90,160,255,0.2)");
        g.fillStyle = grd; g.fillRect(0, 285, 1024, 35);
        // the sun
        const sx = (Math.atan2(SUN_DIR.x, SUN_DIR.z) / (2 * Math.PI) + 0.5) * 1024, sy = (0.5 - Math.asin(SUN_DIR.y) / Math.PI) * 512;
        const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 40);
        sg.addColorStop(0, "rgba(255,255,255,1)"); sg.addColorStop(0.2, "rgba(255,240,210,1)"); sg.addColorStop(1, "rgba(255,200,120,0)");
        g.fillStyle = sg; g.fillRect(sx - 40, sy - 40, 80, 80);
        const tx = new THREE.CanvasTexture(c);
        tx.mapping = THREE.EquirectangularReflectionMapping;
        tx.encoding = THREE.sRGBEncoding;
        return tx;
      }

      // ---------- shader patches ----------
      const uDissolve = { value: -0.2 };
      const uThermal = { value: 0 };
      const uRootInv = { value: new THREE.Matrix4() };
      const uTime = { value: 0 };
      function patchDissolve(mat) {
        mat.onBeforeCompile = (sh) => {
          sh.uniforms.uDissolve = uDissolve; sh.uniforms.uRootInv = uRootInv;
          sh.vertexShader = sh.vertexShader
            .replace("#include <common>", "#include <common>\nvarying vec3 vWorldP;")
            .replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvWorldP = (modelMatrix * vec4(transformed, 1.0)).xyz;");
          sh.fragmentShader = sh.fragmentShader
            .replace("#include <common>", "#include <common>\nvarying vec3 vWorldP;\nuniform float uDissolve;\nuniform mat4 uRootInv;\n" + GLSL_NOISE)
            .replace("#include <clipping_planes_fragment>", `#include <clipping_planes_fragment>
              vec3 lp = (uRootInv * vec4(vWorldP, 1.0)).xyz;
              float dfield = dissolveField(lp);
              if (dfield < uDissolve) discard;
              float edge = 1.0 - smoothstep(0.0, 0.045, dfield - uDissolve);`)
            .replace("#include <emissivemap_fragment>", "#include <emissivemap_fragment>\ntotalEmissiveRadiance += vec3(0.55, 0.85, 1.0) * edge * 9.0 * step(-0.1, uDissolve);");
        };
      }
      function patchThermal(mat, core) {
        mat.onBeforeCompile = (sh) => {
          sh.uniforms.uThermal = uThermal; sh.uniforms.uRootInv = uRootInv; sh.uniforms.uTime = uTime;
          sh.vertexShader = sh.vertexShader
            .replace("#include <common>", "#include <common>\nvarying vec3 vWorldP; varying vec3 vWN;")
            .replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvWorldP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);");
          sh.fragmentShader = sh.fragmentShader
            .replace("#include <common>", `#include <common>
              varying vec3 vWorldP; varying vec3 vWN; uniform float uThermal; uniform mat4 uRootInv; uniform float uTime;
              ${GLSL_NOISE}
              vec3 thermalPal(float x){
                x = clamp(x, 0.0, 1.0);
                vec3 c = mix(vec3(0.02,0.0,0.12), vec3(0.45,0.0,0.55), smoothstep(0.0,0.25,x));
                c = mix(c, vec3(0.95,0.12,0.08), smoothstep(0.25,0.5,x));
                c = mix(c, vec3(1.0,0.62,0.05), smoothstep(0.5,0.75,x));
                c = mix(c, vec3(1.0,1.0,0.75), smoothstep(0.75,1.0,x));
                return c;
              }`)
            .replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>
              { vec3 Vr = normalize(cameraPosition - vWorldP); float fr = pow(clamp(1.0 - abs(dot(normalize(vWN), Vr)), 0.0, 1.0), 3.0);
                totalEmissiveRadiance += vec3(0.45, 0.62, 0.95) * fr * 0.9 * (1.0 - uThermal); }`)
            .replace("#include <dithering_fragment>", `#include <dithering_fragment>
              if (uThermal > 0.0) {
                vec3 lp = (uRootInv * vec4(vWorldP, 1.0)).xyz;
                vec3 V = normalize(cameraPosition - vWorldP);
                float facing = clamp(dot(normalize(vWN), V), 0.0, 1.0);
                float extremity = clamp(length(lp.xz)*1.4 + max(-lp.y, 0.0)*0.6, 0.0, 1.0);
                float temp = ${core.toFixed(2)} - extremity*0.32 + facing*0.12 + (vnoise(lp*9.0 + uTime*0.4)-0.5)*0.08;
                gl_FragColor.rgb = mix(gl_FragColor.rgb, thermalPal(temp) * 2.2, uThermal);
              }`);
        };
      }

      // ---------- materials ----------
      const suitMat = new THREE.MeshStandardMaterial({ color: 0xe9e7e2, roughness: 0.8, metalness: 0.0 });
      const suitDark = new THREE.MeshStandardMaterial({ color: 0x8e9399, roughness: 0.45, metalness: 0.55 });
      const visorMat = new THREE.MeshStandardMaterial({ color: 0xd8a64a, roughness: 0.05, metalness: 1.0, envMapIntensity: 1.6 });
      const packMat = new THREE.MeshStandardMaterial({ color: 0xdcdad5, roughness: 0.65, metalness: 0.05 });
      [suitMat, suitDark, visorMat, packMat].forEach(patchDissolve);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x14171b, roughness: 0.9, metalness: 0.0 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x3e302a, roughness: 0.6, metalness: 0.0 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x0b0908, roughness: 0.8, metalness: 0.0 });
      patchThermal(bodyMat, 0.66); patchThermal(skinMat, 0.82); patchThermal(hairMat, 0.6);

      // ---------- astronaut ----------
      const astro = new THREE.Group();
      scene.add(astro);
      const suitMeshes = [], bodyMeshes = [];
      function addMesh(parent, geo, mat, list, pos, rot, scl) {
        const m = new THREE.Mesh(geo, mat);
        if (pos) m.position.copy(pos);
        if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
        if (scl) m.scale.set(scl[0], scl[1], scl[2]);
        m.castShadow = true; m.receiveShadow = true;
        parent.add(m); if (list) list.push(m);
        return m;
      }
      function lathe(pts, scaleZ) {
        const g = new THREE.LatheGeometry(pts.map((p) => new THREE.Vector2(p[0], p[1])), 48);
        g.scale(1, 1, scaleZ); g.computeVertexNormals(); return g;
      }
      function limb(parent, at, len, rSuit, rBody, rot, ringAt) {
        const j = new THREE.Group(); j.position.copy(at); j.rotation.set(rot[0], rot[1], rot[2]); parent.add(j);
        addMesh(j, new THREE.CapsuleGeometry(rSuit, len, 8, 24), suitMat, suitMeshes, V3(0, -len / 2, 0));
        addMesh(j, new THREE.CapsuleGeometry(rBody, len, 8, 20), bodyMat, bodyMeshes, V3(0, -len / 2, 0));
        if (ringAt != null) addMesh(j, new THREE.TorusGeometry(rSuit * 1.02, 0.014, 10, 32), suitDark, suitMeshes, V3(0, -len * ringAt, 0), [Math.PI / 2, 0, 0]);
        const end = new THREE.Group(); end.position.set(0, -len, 0); j.add(end);
        return end;
      }
      // torso
      const torso = new THREE.Group(); astro.add(torso);
      addMesh(torso, lathe([[0, -0.1], [0.17, -0.08], [0.205, 0.04], [0.225, 0.2], [0.255, 0.38], [0.262, 0.5], [0.205, 0.6], [0.0, 0.62]], 0.74), suitMat, suitMeshes);
      addMesh(torso, lathe([[0, -0.08], [0.135, -0.06], [0.145, 0.1], [0.155, 0.3], [0.175, 0.45], [0.14, 0.55], [0.05, 0.6], [0, 0.6]], 0.62), bodyMat, bodyMeshes);
      // life support backpack (rounded box via extrude)
      function roundedBox(w, h, d, r) {
        const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
        s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
        s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
        const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 4, curveSegments: 8 });
        g.translate(0, 0, -d / 2); g.computeVertexNormals(); return g;
      }
      addMesh(torso, roundedBox(0.5, 0.66, 0.2, 0.06), packMat, suitMeshes, V3(0, 0.3, -0.29));
      addMesh(torso, roundedBox(0.3, 0.14, 0.08, 0.03), suitDark, suitMeshes, V3(0, 0.33, 0.21), [-0.25, 0, 0]);
      addMesh(torso, new THREE.TorusGeometry(0.165, 0.028, 12, 40), suitDark, suitMeshes, V3(0, 0.63, 0), [Math.PI / 2, 0, 0]);
      addMesh(torso, new THREE.TorusGeometry(0.205, 0.02, 10, 40), suitDark, suitMeshes, V3(0, -0.04, 0), [Math.PI / 2, 0, 0], [1, 0.74, 1]);
      // head + helmet
      const head = new THREE.Group(); head.position.set(0, 0.62, 0); head.rotation.set(0.12, -0.18, 0.05); torso.add(head);
      addMesh(head, new THREE.SphereGeometry(0.212, 48, 32), suitMat, suitMeshes, V3(0, 0.18, -0.01));
      addMesh(head, new THREE.SphereGeometry(0.218, 64, 40, Math.PI / 2 - 0.95, 1.9, 0.62, 1.12), visorMat, suitMeshes, V3(0, 0.18, 0.0));
      addMesh(head, new THREE.CylinderGeometry(0.05, 0.055, 0.09, 20), skinMat, bodyMeshes, V3(0, 0.03, 0));
      addMesh(head, new THREE.SphereGeometry(0.1, 40, 30), skinMat, bodyMeshes, V3(0, 0.16, 0.012), null, [0.92, 1.12, 1.0]);
      addMesh(head, new THREE.SphereGeometry(0.104, 40, 30, 0, Math.PI * 2, 0, 1.7), hairMat, bodyMeshes, V3(0, 0.175, -0.008), [-0.35, 0, 0], [0.95, 1.08, 1.02]);
      addMesh(head, new THREE.SphereGeometry(0.02, 12, 10), skinMat, bodyMeshes, V3(0.093, 0.155, 0.0));
      addMesh(head, new THREE.SphereGeometry(0.02, 12, 10), skinMat, bodyMeshes, V3(-0.093, 0.155, 0.0));
      // arms
      const handL = limb(limb(torso, V3(0.27, 0.5, 0), 0.27, 0.088, 0.048, [-0.3, 0, 0.5], 0.1), V3(0, 0, 0), 0.26, 0.08, 0.042, [-0.75, 0, -0.1], 0.85);
      const handR = limb(limb(torso, V3(-0.27, 0.5, 0), 0.27, 0.088, 0.048, [-0.15, 0, -0.42], 0.1), V3(0, 0, 0), 0.26, 0.08, 0.042, [-0.55, 0, 0.12], 0.85);
      for (const hd of [handL, handR]) {
        addMesh(hd, new THREE.SphereGeometry(0.075, 24, 18), suitMat, suitMeshes, V3(0, -0.05, 0), null, [0.85, 1.25, 0.7]);
        addMesh(hd, new THREE.SphereGeometry(0.045, 20, 14), skinMat, bodyMeshes, V3(0, -0.06, 0), null, [0.9, 1.5, 0.6]);
      }
      // legs
      const footL = limb(limb(astro, V3(0.11, -0.06, 0), 0.4, 0.115, 0.075, [-0.35, 0, 0.08], null), V3(0, 0, 0), 0.38, 0.1, 0.058, [0.6, 0, 0], 0.5);
      const footR = limb(limb(astro, V3(-0.11, -0.06, 0), 0.4, 0.115, 0.075, [-0.15, 0, -0.06], null), V3(0, 0, 0), 0.38, 0.1, 0.058, [0.45, 0, 0], 0.5);
      for (const ft of [footL, footR]) {
        addMesh(ft, new THREE.CapsuleGeometry(0.085, 0.14, 8, 18), suitMat, suitMeshes, V3(0, -0.05, 0.06), [Math.PI / 2, 0, 0]);
        addMesh(ft, new THREE.CapsuleGeometry(0.05, 0.12, 8, 14), bodyMat, bodyMeshes, V3(0, -0.04, 0.05), [Math.PI / 2, 0, 0]);
      }
      addMesh(astro, new THREE.CapsuleGeometry(0.11, 0.16, 8, 18), bodyMat, bodyMeshes, V3(0, -0.06, 0), [0, 0, Math.PI / 2]);
      bodyMeshes.forEach((m) => (m.visible = false));

      // ---------- particles: sample the surfaces in astronaut space ----------
      astro.updateMatrixWorld(true);
      function samplePoints(meshes, n, seed, filter) {
        const r = mulberry32(seed), out = [];
        const inv = new THREE.Matrix4().copy(astro.matrixWorld).invert();
        const v = new THREE.Vector3(), nn = new THREE.Vector3();
        let guard = 0;
        while (out.length < n && guard++ < n * 40) {
          const m = meshes[Math.floor(r() * meshes.length)];
          const pa = m.geometry.attributes.position, na = m.geometry.attributes.normal;
          const k = Math.floor(r() * pa.count);
          v.fromBufferAttribute(pa, k).applyMatrix4(m.matrixWorld).applyMatrix4(inv);
          nn.fromBufferAttribute(na, k).transformDirection(m.matrixWorld);
          if (filter && !filter(v)) continue;
          out.push({ p: v.clone(), n: nn.clone(), a: r(), b: r(), c: r(), d: r() });
        }
        return out;
      }
      const dissPts = samplePoints(suitMeshes, 2600, 11);
      dissPts.forEach((q) => (q.th = dissolveField(q.p.x, q.p.y, q.p.z)));
      const headPts = samplePoints(bodyMeshes.filter((m) => m.material === skinMat), 900, 21);
      const bodyPts = samplePoints(bodyMeshes, 700, 23);
      const vapPts = headPts.concat(bodyPts);

      function makePoints(n, color, additive, scale) {
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
        g.setAttribute("alpha", new THREE.BufferAttribute(new Float32Array(n), 1));
        g.setAttribute("size", new THREE.BufferAttribute(new Float32Array(n), 1));
        const m = new THREE.ShaderMaterial({
          uniforms: { color: { value: new THREE.Color(color) }, pscale: { value: scale } },
          transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
          vertexShader: `attribute float alpha; attribute float size; uniform float pscale; varying float vA;
            void main(){ vA = alpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = size * (pscale / -mv.z); gl_Position = projectionMatrix * mv; }`,
          fragmentShader: `uniform vec3 color; varying float vA;
            void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a *= a;
              gl_FragColor = vec4(color * a * vA, a * vA); }`,
        });
        const p = new THREE.Points(g, m); p.frustumCulled = false; return p;
      }
      const dissP = makePoints(dissPts.length, 0xbfe6ff, true, 700.0);
      const vapP = makePoints(vapPts.length, 0xe8f0ff, true, 1400.0);
      astro.add(dissP); astro.add(vapP);

      // ---------- Earth ----------
      const loader = new THREE.TextureLoader();
      const loadTex = (src) => new Promise((res, rej) => loader.load(src, (tx) => {
        tx.wrapS = THREE.RepeatWrapping; tx.anisotropy = 8; res(tx);
      }, undefined, rej));
      const VERT = `varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
        void main(){ vObjN = normalize(position); vWorldN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`;
      const SPH = `
        #define PI 3.14159265359
        vec2 sphUV(vec3 n){ return vec2(atan(n.x, n.z)/(2.0*PI)+0.5, asin(clamp(n.y,-1.0,1.0))/PI+0.5); }
        vec4 samp(sampler2D tx, vec2 uv){ vec2 dx = dFdx(uv), dy = dFdy(uv);
          if (abs(dx.x) > 0.5) dx.x -= sign(dx.x); if (abs(dy.x) > 0.5) dy.x -= sign(dy.x); return textureGrad(tx, uv, dx, dy); }
        vec3 toLin(vec3 c){ return pow(c, vec3(2.2)); }`;
      const earthMat = new THREE.ShaderMaterial({
        uniforms: { dayTex: { value: null }, nightTex: { value: null }, brcTex: { value: null }, specTex: { value: null }, sunDir: { value: SUN_DIR.clone() }, gain: { value: 1 } },
        vertexShader: VERT,
        fragmentShader: `${SPH}
          uniform sampler2D dayTex, nightTex, brcTex, specTex; uniform vec3 sunDir; uniform float gain;
          varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
          void main(){
            vec3 n = normalize(vObjN); vec3 N = normalize(vWorldN); vec3 V = normalize(cameraPosition - vWorldPos);
            vec2 uv = sphUV(n);
            vec3 day = toLin(samp(dayTex, uv).rgb); vec3 night = toLin(samp(nightTex, uv).rgb);
            float cl = samp(brcTex, uv).b; float ocean = samp(specTex, uv).r;
            float ndl = dot(N, sunDir);
            float diff = smoothstep(-0.08, 0.35, ndl) * (0.25 + 0.75*clamp(ndl, 0.0, 1.0));
            vec3 col = mix(day, vec3(0.92), smoothstep(0.15, 0.95, cl)*0.75) * diff * 0.95;
            vec3 Hh = normalize(sunDir + V);
            col += vec3(1.0,0.9,0.75) * pow(max(dot(N,Hh),0.0), 400.0) * ocean * (1.0-cl) * 0.8;
            col += night * (1.0 - smoothstep(-0.12, 0.08, ndl)) * (1.0 - ocean) * 2.2;
            float mu = clamp(dot(N, V), 0.0, 1.0);
            float rimF = pow(clamp(1.0 - mu, 0.0, 1.0), 3.0);
            float lit = smoothstep(-0.25, 0.4, ndl);
            col = mix(col, mix(vec3(0.18,0.42,1.0), vec3(0.55,0.78,1.0), rimF) * lit * 1.2, rimF*0.8*lit + 0.04*lit);
            gl_FragColor = vec4(col * gain, 1.0);
          }`,
      });
      const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), earthMat);
      const EARTH_R = 40;
      earth.scale.setScalar(EARTH_R);
      earth.position.set(0, -46, -34);
      earth.rotation.set(0.35, -1.9, 0.15);
      scene.add(earth);
      const atmoMat = new THREE.ShaderMaterial({
        uniforms: { sunDir: { value: SUN_DIR.clone() }, center: { value: earth.position } },
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        vertexShader: VERT,
        fragmentShader: `uniform vec3 sunDir; uniform vec3 center; varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
          void main(){ vec3 V = normalize(cameraPosition - vWorldPos); vec3 N = normalize(vWorldN);
            float g = pow(clamp(dot(-N, V), 0.0, 1.0), 7.0) * 1.3;
            float lit = smoothstep(-0.35, 0.5, dot(normalize(vWorldPos - center), sunDir));
            gl_FragColor = vec4(vec3(0.25,0.5,1.0) * g * (0.06 + lit), 1.0); }`,
      });
      const atmo = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), atmoMat);
      atmo.scale.setScalar(EARTH_R * 1.04); atmo.position.copy(earth.position);
      scene.add(atmo);

      // ---------- galaxy sky ----------
      const skyMat = new THREE.ShaderMaterial({
        uniforms: { op: { value: 1 } },
        side: THREE.BackSide, depthWrite: false,
        vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform float op; varying vec3 vDir;
          ${GLSL_NOISE}
          float fbm(vec3 p){ float s=0.0, a=0.5; for(int i=0;i<5;i++){ s += a*vnoise(p); p = p*2.07 + 1.3; a *= 0.5; } return s; }
          void main(){
            vec3 d = normalize(vDir);
            vec3 axis = normalize(vec3(0.35, 0.82, -0.45));
            float band = dot(d, axis);
            float core = exp(-band*band*18.0);
            float wide = exp(-band*band*4.0);
            float n = fbm(d*3.2 + 1.7);
            float dust = smoothstep(0.42, 0.7, fbm(d*6.0 + 9.0)) * core;
            vec3 neb = mix(vec3(0.01,0.02,0.07), vec3(0.04,0.07,0.18), n) * wide * 0.5;
            neb += vec3(0.30,0.36,0.62) * core * smoothstep(0.4, 0.85, n) * 0.35;
            neb += vec3(0.16,0.06,0.22) * smoothstep(0.55, 0.85, fbm(d*2.0+4.0)) * wide * 0.25;
            neb *= 1.0 - dust*0.85;
            vec3 g = d * 420.0; vec3 cell = floor(g); float r = h3(cell);
            float star = step(0.9965 - core*0.004, r) * smoothstep(0.42, 0.0, length(fract(g) - 0.5));
            vec3 col = vec3(0.004, 0.007, 0.018) + neb + star * mix(vec3(0.7,0.8,1.0), vec3(1.0,0.9,0.75), h3(cell+3.0)) * 1.6;
            gl_FragColor = vec4(col * op, 1.0);
          }`,
      });
      const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 64, 32), skyMat);
      scene.add(sky);

      // sun disc
      const sunMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `varying vec2 vUv; void main(){ float d = length(vUv - 0.5);
          vec3 c = vec3(1.0,0.97,0.9) * smoothstep(0.05, 0.035, d) * 30.0 + vec3(1.0,0.8,0.55) * exp(-d*18.0) * 1.5;
          gl_FragColor = vec4(c, 1.0); }`,
      });
      const sun = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), sunMat);
      sun.position.copy(SUN_DIR).multiplyScalar(1200); sun.scale.setScalar(220);
      scene.add(sun);

      // ---------- post ----------
      const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
      const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const postScene = new THREE.Scene();
      const postMat = new THREE.ShaderMaterial({
        uniforms: { src: { value: rt.texture }, exposure: { value: 1 }, frame: { value: 0 }, tunnel: { value: 0 }, thermalBg: { value: 0 }, ab: { value: 0 }, fade: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: `uniform sampler2D src; uniform float exposure, frame, tunnel, thermalBg, ab, fade; varying vec2 vUv;
          vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
          float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + frame*0.731) * 43758.5453); }
          void main(){
            vec2 d = (vUv - 0.5) * ab;
            vec3 c = vec3(texture2D(src, vUv + d).r, texture2D(src, vUv).g, texture2D(src, vUv - d).b);
            // soft glow from the brightest points
            vec3 b = vec3(0.0);
            for (int i = 0; i < 8; i++) { float a = float(i)*0.785; vec2 o = vec2(cos(a), sin(a)*0.5625) * 0.006;
              b += max(texture2D(src, vUv + o).rgb - 1.2, 0.0) + max(texture2D(src, vUv + o*2.6).rgb - 1.2, 0.0)*0.6; }
            c += b * 0.09;
            c = aces(c * exposure);
            float lum = dot(c, vec3(0.299, 0.587, 0.114));
            vec2 q = (vUv - 0.5) * vec2(0.75, 1.0);
            float r = length(q);
            c *= 1.0 - 0.38 * smoothstep(0.25, 0.75, r);
            float tun = smoothstep(0.55 - tunnel*0.42, 0.75 - tunnel*0.35, r) * tunnel;
            c = mix(c, vec3(lum)*0.4, tunnel*0.5) * (1.0 - tun);
            c = mix(c, c * vec3(0.55, 0.7, 1.0), thermalBg * 0.0);
            c = pow(c, vec3(1.0/2.2));
            c += (h(gl_FragCoord.xy) - 0.5) * 0.03;
            c *= 1.0 - fade;
            gl_FragColor = vec4(c, 1.0);
          }`,
      });
      postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

      // ---------- shots ----------
      const HELM = V3(0, 0.98, 0.0);
      function shotAt(t) {
        const s = { pos: null, tgt: null, fov: 32, shake: 0, roll: 0, astroPos: V3(0, 0, 0), astroRot: V3(0, 0, 0), earthGain: 1, skyOp: 1, ab: 0 };
        const drift = (k) => V3(Math.sin(t * 0.37 + k) * 0.02, Math.sin(t * 0.29 + k * 2) * 0.025, 0);
        s.astroRot.set(0.05 * Math.sin(t * 0.21), -0.25 + 0.06 * Math.sin(t * 0.17), 0.08 * Math.sin(t * 0.13));
        s.astroPos.copy(drift(0));
        if (t < 1.6) { // A: helmet close-up, Earth in the visor
          const u = t / 1.6;
          s.pos = lv(V3(0.62, 1.12, 0.78), V3(0.48, 1.08, 0.64), easeIO(u)); s.tgt = V3(0.0, 0.95, 0.05); s.fov = 30;
        } else if (t < 3.0) { // B: wide, astronaut above the Earth
          const u = (t - 1.6) / 1.4;
          s.pos = lv(V3(1.6, 1.5, 8.4), V3(1.3, 1.2, 7.4), u); s.tgt = V3(0, -1.1, 0); s.fov = 32;
        } else if (t < T_VANISH) { // C: medium, tension, backlit
          const u = (t - 3.0) / (T_VANISH - 3.0);
          s.pos = lv(V3(2.1, 0.7, 3.0), V3(1.7, 0.66, 2.5), easeIO(u)); s.tgt = V3(0, 0.25, 0); s.fov = 32;
        } else if (t < 7.85) { // D: the suit vanishes, he does not explode
          const u = (t - T_VANISH) / (7.85 - T_VANISH);
          s.pos = lv(V3(1.7, 0.62, 2.45), V3(1.5, 0.58, 2.2), u); s.tgt = V3(0, 0.28, 0); s.fov = 32;
          s.shake = Math.exp(-(t - T_VANISH) * 4.5);
          s.ab = 0.01 * Math.exp(-(t - T_VANISH) * 5);
        } else if (t < 11.6) { // E: moisture boils off, glowing against the sun
          const u = (t - 7.85) / 3.75;
          s.pos = lv(V3(1.9, 1.05, 0.25), V3(1.6, 1.0, 0.1), easeIO(u)); s.tgt = V3(0, 0.6, -0.1); s.fov = 32;
        } else if (t < 16.9) { // F: point of view, the world fades
          const u = (t - 11.6) / 5.3;
          s.pos = V3(0.0, 0.98, 0.12).add(V3(Math.sin(t * 0.9) * 0.01, Math.sin(t * 0.7) * 0.012, 0));
          s.tgt = lv(V3(0.4, -0.9, -4.0), V3(0.9, -1.6, -3.6), easeIO(u)); s.fov = 40;
          s.roll = 0.05 * Math.sin(t * 0.8) * sstep(12, 16, t);
          s.astroPos = V3(0, -200, 0);
          s.pov = true;
        } else if (t < T_THERMAL) { // G: tiny in the cold
          const u = (t - 16.9) / (T_THERMAL - 16.9);
          s.pos = lv(V3(2.6, 2.6, 13.5), V3(3.0, 3.0, 15.5), u); s.tgt = V3(0, -2.2, 0); s.fov = 34;
        } else if (t < 22.4) { // H: thermal view
          const u = (t - T_THERMAL) / (22.4 - T_THERMAL);
          s.pos = lv(V3(0.6, 0.6, 3.3), V3(0.45, 0.55, 2.8), u); s.tgt = V3(0, 0.25, 0); s.fov = 32;
        } else if (t < 25.6) { // I: drifting away
          const u = (t - 22.4) / 3.2;
          s.pos = V3(1.2, 0.8, 3.0); s.tgt = lv(V3(0, 0.25, 0), V3(0, -1.2, -9), easeIO(u)); s.fov = 32;
          s.astroPos = V3(0, -1.6, -11).multiplyScalar(easeIO(u) * 0.9 + u * 0.1);
          s.astroRot.set(0.05 + u * 1.6, -0.25 + u * 0.8, 0.08 + u * 0.9);
        } else { // J: closing card
          const u = (t - 25.6) / (DUR - 25.6);
          s.pos = lv(V3(0, 0.2, 9), V3(0, 0.2, 7.5), easeIO(u)); s.tgt = V3(-4, 7, -30); s.fov = 34;
          s.astroPos = V3(0, -200, 0);
        }
        return s;
      }

      const tmpInv = new THREE.Matrix4();
      const vtmp = new THREE.Vector3();
      let envReady = false, ready = false;

      function updateParticles(t) {
        // dissolve sparks
        const pa = dissP.geometry.attributes.position.array, aa = dissP.geometry.attributes.alpha.array, sa = dissP.geometry.attributes.size.array;
        const dv = uDissolve.value;
        for (let i = 0; i < dissPts.length; i++) {
          const q = dissPts[i];
          const born = T_VANISH + (q.th + 0.12) / 1.3 * 0.75;   // inverse of the dissolve ramp
          const age = t - born;
          if (age < 0 || age > 1.6 || t < T_VANISH) { aa[i] = 0; sa[i] = 0; pa[i * 3] = pa[i * 3 + 1] = pa[i * 3 + 2] = 0; continue; }
          const sp = 0.25 + q.a * 0.6;
          pa[i * 3] = q.p.x + q.n.x * age * sp + (q.b - 0.5) * age * 0.3;
          pa[i * 3 + 1] = q.p.y + q.n.y * age * sp + (q.c - 0.5) * age * 0.3;
          pa[i * 3 + 2] = q.p.z + q.n.z * age * sp;
          aa[i] = Math.exp(-age * 2.8) * 1.4;
          sa[i] = 0.012 + q.d * 0.02;
        }
        dissP.geometry.attributes.position.needsUpdate = true; dissP.geometry.attributes.alpha.needsUpdate = true; dissP.geometry.attributes.size.needsUpdate = true;
        // vapour boiling off the skin and clothes
        const vp = vapP.geometry.attributes.position.array, va = vapP.geometry.attributes.alpha.array, vs = vapP.geometry.attributes.size.array;
        const amt = sstep(T_VAPOR - 0.3, T_VAPOR + 0.8, t) * (1 - sstep(16.5, 19.0, t) * 0.75);
        for (let i = 0; i < vapPts.length; i++) {
          const q = vapPts[i];
          const life = 1.1 + q.a * 1.4;
          const ph = (t * (0.6 + q.b * 0.5) + q.c * 7.0) % life;
          const ok = amt > 0.001 && t > T_VAPOR - 0.3 + q.d * 0.6;
          if (!ok) { va[i] = 0; vs[i] = 0; continue; }
          const sp = 0.06 + q.a * 0.12;
          vp[i * 3] = q.p.x + q.n.x * ph * sp + Math.sin(ph * 2 + q.b * 6) * 0.01;
          vp[i * 3 + 1] = q.p.y + q.n.y * ph * sp + ph * 0.015;
          vp[i * 3 + 2] = q.p.z + q.n.z * ph * sp;
          const fadeIn = clamp(ph / 0.25, 0, 1), fadeOut = 1 - clamp(ph / life, 0, 1);
          va[i] = 0.22 * fadeIn * fadeOut * amt * (i < headPts.length ? 1.2 : 0.9);
          vs[i] = (0.02 + ph * 0.05) * (0.7 + q.d * 0.6);
        }
        vapP.geometry.attributes.position.needsUpdate = true; vapP.geometry.attributes.alpha.needsUpdate = true; vapP.geometry.attributes.size.needsUpdate = true;
      }

      function renderAt(t) {
        if (!ready) return;
        t = clamp(t, 0, DUR - 1 / 60);
        uTime.value = t;
        const s = shotAt(t);
        astro.position.copy(s.astroPos);
        astro.rotation.set(s.astroRot.x, s.astroRot.y, s.astroRot.z);
        astro.updateMatrixWorld(true);
        uRootInv.value.copy(astro.matrixWorld).invert();

        // suit dissolve: -0.12 → 1.18 over 0.75 s
        uDissolve.value = t < T_VANISH ? -0.2 : lerp(-0.12, 1.18, clamp((t - T_VANISH) / 0.75, 0, 1));
        const suitGone = uDissolve.value >= 1.15;
        suitMeshes.forEach((m) => (m.visible = !suitGone));
        bodyMeshes.forEach((m) => (m.visible = t >= T_VANISH));
        uThermal.value = sstep(T_THERMAL - 0.05, T_THERMAL + 0.35, t) * (1 - sstep(22.15, 22.45, t));
        updateParticles(t);

        camera.fov = s.fov;
        camera.position.copy(s.pos);
        camera.up.set(0, 1, 0);
        camera.lookAt(s.tgt);
        if (s.shake > 0) {
          const k = Math.floor(t * 30), r1 = mulberry32(k * 7 + 3)(), r2 = mulberry32(k * 11 + 9)();
          camera.rotateX((r1 - 0.5) * 0.03 * s.shake); camera.rotateY((r2 - 0.5) * 0.03 * s.shake);
        }
        if (s.roll) camera.rotateZ(s.roll);
        camera.updateProjectionMatrix();

        // thermal look: the world goes cold and dark around the warm body
        const th = uThermal.value;
        earthMat.uniforms.gain.value = 1 - th * 0.85;
        skyMat.uniforms.op.value = 1 - th * 0.7;
        sunLight.intensity = 4.2 * (1 - th * 0.6);

        renderer.setRenderTarget(rt);
        renderer.render(scene, camera);
        postMat.uniforms.frame.value = Math.floor(t * 30);
        postMat.uniforms.ab.value = s.ab;
        postMat.uniforms.tunnel.value = sstep(12.6, 16.6, t) * (1 - sstep(16.85, 17.0, t));
        const hb = s.pov ? Math.pow(Math.max(0, Math.sin((t - 11.6) * Math.PI * (1.15 - (t - 11.6) * 0.05))), 12) : 0;
        postMat.uniforms.exposure.value = 0.85 * (1 - hb * 0.25);
        postMat.uniforms.fade.value = 0;
        renderer.setRenderTarget(null);
        renderer.render(postScene, quadCam);

        const k = t - T_VANISH;
        flashEl.style.opacity = k >= 0 && k < 0.45 ? String(0.75 * Math.exp(-k * 9)) : "0";
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const imgLoad = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
      window.__hf.buildReady["space"] = Promise.all([
        loadTex("assets/tex/earth_day_4096.jpg"),
        loadTex("assets/tex/earth_night_4096.jpg"),
        loadTex("assets/tex/earth_bump_roughness_clouds_4096.jpg"),
        loadTex("assets/tex/earth_specular_2048.jpg"),
        imgLoad("assets/tex/earth_day_4096.jpg"),
      ]).then(([day, night, brc, spec, dayImg]) => {
        earthMat.uniforms.dayTex.value = day;
        earthMat.uniforms.nightTex.value = night;
        earthMat.uniforms.brcTex.value = brc;
        earthMat.uniforms.specTex.value = spec;
        const pmrem = new THREE.PMREMGenerator(renderer);
        const env = pmrem.fromEquirectangular(makeEnvTexture(dayImg)).texture;
        [suitMat, suitDark, visorMat, packMat, bodyMat, skinMat, hairMat].forEach((m) => { m.envMap = env; m.envMapIntensity = m === visorMat ? 1.6 : 0.45; m.needsUpdate = true; });
        pmrem.dispose();
        ready = true;
        renderAt(lastT);
      });

      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DUR });
      window.__timelines["space"] = tl;
    })();
  </script>
</template>
