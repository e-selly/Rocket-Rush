<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #050b14;
      overflow: hidden;
    }
    #sim-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .sim-label {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "Inter", sans-serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.14em;
      white-space: nowrap;
      opacity: 0;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    .sim-label .v {
      display: block;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -0.01em;
      margin-top: 2px;
    }
    .teal { color: #5fe3d0; }
    .ice { color: #8fdbff; }
  </style>
  <div id="root" data-composition-id="space" data-width="1080" data-height="1920" data-duration="35" data-layout-allow-overflow>
    <canvas id="sim-canvas" width="1080" height="1920"></canvas>
    <div id="lbl-skin" class="sim-label teal">HAUT HÄLT DICHT<span class="v">KEINE EXPLOSION</span></div>
    <div id="lbl-vapor" class="sim-label ice">FEUCHTIGKEIT<span class="v">VERDAMPFT</span></div>
  </div>
  <script>
    (function () {
      const W = 1080, H = 1920, DUR = 35;
      const cv = document.getElementById("sim-canvas");
      const g = cv.getContext("2d");
      const L = {
        skin: document.getElementById("lbl-skin"),
        vapor: document.getElementById("lbl-vapor"),
      };

      // story beats in video seconds (the voice starts at 1.6 s)
      const T_VANISH = 4.95, T_SLOW = 7.9, T_FAST = 11.6, T_LIVE2 = 16.4, T_GRAPH = 19.2, T_DRIFT = 22.4, T_END = 25.6;

      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, u) => a + (b - a) * u;
      const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
      const easeIO = (u) => { u = clamp(u, 0, 1); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const C = { navyTop: "#050b14", navyBot: "#0b1a2b", teal: "#5fe3d0", amber: "#ffb547" };

      // seeded scenery
      const R = mulberry32(42);
      const stars = Array.from({ length: 520 }, () => ({ x: R() * 1600 - 260, y: R() * 1700 - 200, r: 0.6 + Math.pow(R(), 5) * 2.4, a: 0.25 + R() * 0.75, ph: R() * 6.28 }));
      const dust = Array.from({ length: 90 }, () => ({ x: R() * W, y: R() * H, r: 0.8 + R() * 1.8, v: 6 + R() * 18, a: 0.08 + R() * 0.18 }));
      const glows = [
        { x: 300, y: 260, r: 520, c: "rgba(60,90,190,0.10)" },
        { x: 820, y: 520, r: 600, c: "rgba(110,60,170,0.07)" },
        { x: 560, y: 120, r: 380, c: "rgba(80,140,220,0.08)" },
      ];

      // figure rig in scene units, origin at the hips
      function rig(t, limp) {
        const sway = Math.sin(t * 0.6) * 0.04, bob = Math.sin(t * 0.45) * 6;
        const a = (base, amp, k) => base + Math.sin(t * 0.5 + k) * amp;
        const L1 = lerp(-2.25, -2.75, limp), L2 = lerp(-0.6, -0.15, limp);
        const R1 = lerp(-0.75, -0.45, limp), R2 = lerp(-1.1, -1.5, limp);
        const P = {};
        P.hip = [0, bob];
        P.neck = [Math.sin(sway) * 170, -170 + bob];
        P.head = [P.neck[0] + lerp(6, 22, limp), P.neck[1] - 58 + lerp(0, 10, limp)];
        const sh = (sx) => [P.neck[0] + sx, P.neck[1] + 22];
        P.shL = sh(-52); P.shR = sh(52);
        const seg = (p, ang, len) => [p[0] + Math.cos(ang) * len, p[1] - Math.sin(ang) * len];
        P.elL = seg(P.shL, a(L1, 0.05, 0), 95); P.haL = seg(P.elL, a(L1 + L2, 0.06, 1), 88);
        P.elR = seg(P.shR, a(R1, 0.05, 2), 95); P.haR = seg(P.elR, a(R1 + R2, 0.06, 3), 88);
        P.hipL = [-30, bob + 8]; P.hipR = [30, bob + 8];
        P.knL = seg(P.hipL, a(-1.85, 0.03, 4), 130); P.ftL = seg(P.knL, a(-2.4, 0.04, 5), 125);
        P.knR = seg(P.hipR, a(-1.35, 0.03, 6), 130); P.ftR = seg(P.knR, a(-2.05, 0.04, 7), 125);
        return P;
      }
      function limbStroke(pts, w, col) {
        g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round";
        g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke();
      }
      function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

      function drawSuit(P, alpha) {
        if (alpha <= 0) return;
        g.save(); g.globalAlpha = alpha;
        const base = "#d9e1e9", shade = "#9fb1c2", dark = "#56677a";
        limbStroke([P.shR, P.elR, P.haR], 50, shade);
        limbStroke([P.hipR, P.knR, P.ftR], 64, shade);
        g.fillStyle = dark; g.beginPath(); g.arc(P.ftR[0], P.ftR[1], 34, 0, 6.29); g.fill();
        g.save(); g.translate(P.neck[0] * 0.6 - 18, -98); g.rotate(-0.05); g.fillStyle = shade; rrect(-88, -95, 176, 200, 26); g.fill(); g.restore();
        g.save(); g.translate(P.neck[0] * 0.5, -88); g.fillStyle = base; rrect(-78, -92, 156, 196, 50); g.fill();
        g.fillStyle = "rgba(0,0,0,0.09)"; rrect(18, -92, 60, 196, 40); g.fill();
        g.fillStyle = dark; rrect(-44, -30, 88, 44, 10); g.fill();
        g.fillStyle = C.teal; g.fillRect(-30, -18, 12, 8); g.fillStyle = C.amber; g.fillRect(-12, -18, 12, 8);
        g.restore();
        limbStroke([P.hipL, P.knL, P.ftL], 66, base);
        g.strokeStyle = dark; g.lineWidth = 6; g.beginPath(); g.arc(P.knL[0], P.knL[1], 30, 0, 6.29); g.stroke();
        g.fillStyle = dark; g.beginPath(); g.arc(P.ftL[0], P.ftL[1], 36, 0, 6.29); g.fill();
        g.fillStyle = base; g.beginPath(); g.arc(P.head[0], P.head[1], 70, 0, 6.29); g.fill();
        g.fillStyle = dark; g.beginPath(); g.ellipse(P.neck[0], P.neck[1] + 2, 58, 16, 0, 0, 6.29); g.fill();
        const vg = g.createLinearGradient(P.head[0] - 50, P.head[1] - 40, P.head[0] + 40, P.head[1] + 40);
        vg.addColorStop(0, "#ffd27a"); vg.addColorStop(0.45, "#e09a2c"); vg.addColorStop(1, "#7a4a12");
        g.fillStyle = vg; g.beginPath(); g.ellipse(P.head[0] - 12, P.head[1] + 4, 48, 40, -0.15, 0, 6.29); g.fill();
        g.strokeStyle = "rgba(255,255,255,0.75)"; g.lineWidth = 6; g.lineCap = "round";
        g.beginPath(); g.ellipse(P.head[0] - 12, P.head[1] + 4, 36, 28, -0.15, 3.5, 4.5); g.stroke();
        limbStroke([P.shL, P.elL, P.haL], 50, base);
        g.strokeStyle = dark; g.lineWidth = 6; g.beginPath(); g.arc(P.elL[0], P.elL[1], 22, 0, 6.29); g.stroke();
        g.fillStyle = base; g.beginPath(); g.arc(P.haL[0], P.haL[1], 28, 0, 6.29); g.fill();
        g.restore();
      }

      function drawHuman(P, alpha, heat) {
        if (alpha <= 0) return;
        g.save(); g.globalAlpha = alpha;
        const body = "#142233";
        const parts = () => {
          limbStroke([P.shR, P.elR, P.haR], 30, body);
          limbStroke([P.hipR, P.knR, P.ftR], 40, body);
          g.fillStyle = body; g.save(); g.translate(P.neck[0] * 0.5, -88); rrect(-55, -88, 110, 186, 40); g.fill(); g.restore();
          limbStroke([P.hipL, P.knL, P.ftL], 42, body);
          limbStroke([P.neck, [P.head[0] * 0.5 + P.neck[0] * 0.5, P.head[1] + 30]], 26, body);
          g.fillStyle = body; g.beginPath(); g.ellipse(P.head[0], P.head[1] + 4, 40, 46, 0.1, 0, 6.29); g.fill();
          limbStroke([P.shL, P.elL, P.haL], 30, body);
        };
        // rim light from the sun (upper right): a glowing copy, then the body on top
        g.save(); g.shadowColor = "rgba(150,210,255,0.95)"; g.shadowBlur = 16; g.shadowOffsetX = 4; g.shadowOffsetY = -3; parts(); g.restore();
        parts();
        if (heat > 0) {
          const hg = g.createRadialGradient(P.neck[0] * 0.5, -70, 10, P.neck[0] * 0.5, -70, 230);
          hg.addColorStop(0, `rgba(255,181,71,${0.38 * heat})`); hg.addColorStop(1, "rgba(255,181,71,0)");
          g.globalCompositeOperation = "lighter"; g.fillStyle = hg; g.beginPath(); g.arc(P.neck[0] * 0.5, -70, 230, 0, 6.29); g.fill();
        }
        g.restore();
      }

      // particles
      const PR = mulberry32(7);
      const burst = Array.from({ length: 900 }, () => {
        const k = PR();
        return { zone: k < 0.25 ? "head" : k < 0.6 ? "torso" : "limb", u: PR(), v: PR(), ang: PR() * 6.283, sp: 220 + PR() * 620, life: 0.6 + PR() * 1.1, r: 1.5 + PR() * 3.5, warm: PR() < 0.35 };
      });
      const vapor = Array.from({ length: 300 }, () => ({ src: PR() < 0.65 ? "head" : PR() < 0.5 ? "haL" : "haR", ang: PR() * 6.283, life: 1.6 + PR() * 1.8, ph: PR() * 10, sp: 40 + PR() * 70, r: 6 + PR() * 14 }));

      // camera keys: time, focus x, focus y, zoom
      const CAM = [
        [0, 0, -120, 1.0], [T_VANISH, 0, -105, 1.12], [T_SLOW, 0, -80, 1.18],
        [T_SLOW + 0.6, 10, -210, 2.25], [T_FAST - 0.3, 18, -225, 2.45],
        [T_FAST + 0.5, 0, -90, 1.35], [T_LIVE2, 0, -90, 1.5],
        [T_LIVE2 + 0.5, 0, -40, 0.9], [T_GRAPH, 0, -40, 0.95],
        [T_DRIFT, 0, -40, 1.05], [T_END, 0, 160, 0.62], [DUR, 0, 160, 0.58],
      ];
      function cameraAt(t) {
        let i = 0; while (i < CAM.length - 2 && t >= CAM[i + 1][0]) i++;
        const a = CAM[i], b = CAM[i + 1], u = easeIO((t - a[0]) / (b[0] - a[0]));
        return { fx: lerp(a[1], b[1], u), fy: lerp(a[2], b[2], u), z: lerp(a[3], b[3], u) };
      }

      let earthImg = null, ready = false, lastT = 0;
      function drawBackground(t, cam, blur) {
        const bg = g.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, C.navyTop); bg.addColorStop(1, C.navyBot);
        g.fillStyle = bg; g.fillRect(0, 0, W, H);
        g.save();
        if (blur > 0.05) g.filter = `blur(${blur.toFixed(1)}px)`;
        for (const gl of glows) {
          const rg = g.createRadialGradient(gl.x, gl.y, 0, gl.x, gl.y, gl.r);
          rg.addColorStop(0, gl.c); rg.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = rg; g.fillRect(0, 0, W, H);
        }
        const par = 0.15, ox = -cam.fx * par, oy = -cam.fy * par;
        for (const s of stars) {
          const tw = 0.7 + 0.3 * Math.sin(t * 1.3 + s.ph);
          g.fillStyle = `rgba(220,232,255,${(s.a * tw).toFixed(3)})`;
          g.beginPath(); g.arc(s.x + ox, s.y + oy, s.r * (1 + (cam.z - 1) * par), 0, 6.29); g.fill();
        }
        const sx = 880 + ox * 0.6, sy = 300 + oy * 0.6;
        const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 160);
        sg.addColorStop(0, "rgba(255,250,235,1)"); sg.addColorStop(0.12, "rgba(255,240,210,0.95)"); sg.addColorStop(0.3, "rgba(255,200,140,0.25)"); sg.addColorStop(1, "rgba(255,180,120,0)");
        g.fillStyle = sg; g.beginPath(); g.arc(sx, sy, 160, 0, 6.29); g.fill();
        const ez = 1 + (cam.z - 1) * 0.35;
        const ex = 540 + ox * 1.6, ey = 2620 + oy * 1.6 - (cam.z - 1) * 120, er = 1380 * ez;
        if (earthImg) {
          g.save(); g.beginPath(); g.arc(ex, ey, er, 0, 6.29); g.clip();
          g.drawImage(earthImg, ex - er * 1.9, ey - er * 1.02, er * 3.8, er * 1.9);
          g.globalCompositeOperation = "multiply"; g.fillStyle = "rgba(10,28,52,0.55)"; g.fillRect(ex - er, ey - er, er * 2, er * 2);
          g.globalCompositeOperation = "source-over";
          const sh = g.createLinearGradient(ex + er * 0.2, ey - er, ex - er * 0.6, ey - er * 0.6);
          sh.addColorStop(0, "rgba(5,11,20,0)"); sh.addColorStop(1, "rgba(5,11,20,0.55)");
          g.fillStyle = sh; g.fillRect(ex - er, ey - er, er * 2, er * 2);
          g.restore();
          const ag = g.createRadialGradient(ex, ey, er * 0.985, ex, ey, er * 1.05);
          ag.addColorStop(0, "rgba(95,190,255,0)"); ag.addColorStop(0.25, "rgba(110,200,255,0.75)"); ag.addColorStop(1, "rgba(80,160,255,0)");
          g.fillStyle = ag; g.beginPath(); g.arc(ex, ey, er * 1.05, 0, 6.29); g.fill();
        }
        g.restore();
        for (const d of dust) {
          const y = (d.y + t * d.v) % H, x = (d.x + t * d.v * 0.4) % W;
          g.fillStyle = `rgba(200,220,255,${d.a})`; g.beginPath(); g.arc(x, y, d.r, 0, 6.29); g.fill();
        }
      }

      function partPoint(P, q) {
        if (q.zone === "head") return [P.head[0] + Math.cos(q.ang) * 60 * q.u, P.head[1] + Math.sin(q.ang) * 60 * q.u];
        if (q.zone === "torso") return [P.neck[0] * 0.5 + (q.u - 0.5) * 150, -180 + q.v * 190];
        const limbs = [[P.shL, P.elL, P.haL], [P.shR, P.elR, P.haR], [P.hipL, P.knL, P.ftL], [P.hipR, P.knR, P.ftR]];
        const lb = limbs[Math.floor(q.u * 3.999)], s = q.v * 2, i = Math.min(1, Math.floor(s)), f = s - i;
        return [lerp(lb[i][0], lb[i + 1][0], f), lerp(lb[i][1], lb[i + 1][1], f)];
      }

      function renderAt(t) {
        if (!ready) return;
        t = clamp(t, 0, DUR - 1 / 60);
        const cam = cameraAt(t);
        const blur = sstep(T_SLOW, T_SLOW + 0.5, t) * (1 - sstep(T_FAST - 0.2, T_FAST + 0.3, t)) * 7;
        g.setTransform(1, 0, 0, 1, 0, 0); g.filter = "none"; g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
        drawBackground(t, cam, blur);

        const drift = sstep(T_DRIFT, T_END + 0.4, t);
        const limp = sstep(13.6, 16.4, t);
        const spin = drift * 1.1 + Math.sin(t * 0.3) * 0.03;
        const bodyScale = lerp(1, 0.32, drift);
        const P = rig(t, limp);

        g.setTransform(cam.z, 0, 0, cam.z, 540 - cam.fx * cam.z, 1010 - cam.fy * cam.z);
        g.translate(lerp(0, 120, drift), lerp(0, 420, drift)); g.rotate(spin); g.scale(bodyScale, bodyScale);
        const bodyM = g.getTransform();

        const suitA = t < T_VANISH ? 1 : 1 - sstep(T_VANISH, T_VANISH + 0.18, t);
        const humanA = sstep(T_VANISH, T_VANISH + 0.25, t) * (1 - sstep(T_END + 0.6, T_END + 1.4, t));
        const heat = sstep(17.0, 18.2, t) * (1 - sstep(T_GRAPH, T_GRAPH + 0.3, t)) + sstep(T_DRIFT, T_DRIFT + 0.5, t) * 0.6;
        drawHuman(P, humanA, heat);
        drawSuit(P, suitA);

        // the suit bursts: shards fly outward, two pressure rings
        const kb = t - T_VANISH;
        if (kb > -0.01 && kb < 2.0) {
          g.save(); g.globalCompositeOperation = "lighter";
          for (const q of burst) {
            if (kb > q.life) continue;
            const p0 = partPoint(P, q), u = kb / q.life;
            g.fillStyle = q.warm ? `rgba(255,190,90,${(1 - u) * 0.9})` : `rgba(215,235,255,${(1 - u) * 0.9})`;
            g.beginPath(); g.arc(p0[0] + Math.cos(q.ang) * q.sp * kb, p0[1] + Math.sin(q.ang) * q.sp * kb, q.r * (1 - u * 0.5), 0, 6.29); g.fill();
          }
          for (let r = 0; r < 2; r++) {
            const kk = kb - r * 0.12; if (kk < 0 || kk > 1.1) continue;
            g.strokeStyle = `rgba(95,227,208,${(1 - kk / 1.1) * 0.8})`; g.lineWidth = 10 * (1 - kk / 1.1) + 1;
            g.beginPath(); g.arc(0, -120, 80 + kk * 900, 0, 6.29); g.stroke();
          }
          g.restore();
        }

        // moisture boiling off the skin
        const vapAmt = sstep(8.3, 9.2, t) * (1 - sstep(16.4, 18.5, t) * 0.8) * (1 - drift);
        if (vapAmt > 0.001) {
          g.save(); g.globalCompositeOperation = "lighter";
          for (const q of vapor) {
            const age = (t + q.ph) % q.life, u = age / q.life;
            const src = q.src === "head" ? [P.head[0] + Math.cos(q.ang) * 34, P.head[1] + Math.sin(q.ang) * 38] : P[q.src];
            const x = src[0] + Math.cos(q.ang) * q.sp * age * 0.7, y = src[1] + Math.sin(q.ang) * q.sp * age * 0.5 - age * 26;
            const rr = q.r * (0.6 + u * 2.2), a = Math.sin(u * Math.PI) * 0.22 * vapAmt;
            const vg = g.createRadialGradient(x, y, 0, x, y, rr);
            vg.addColorStop(0, `rgba(225,238,255,${a})`); vg.addColorStop(1, "rgba(225,238,255,0)");
            g.fillStyle = vg; g.beginPath(); g.arc(x, y, rr, 0, 6.29); g.fill();
          }
          g.restore();
        }

        g.setTransform(1, 0, 0, 1, 0, 0);
        const tun = sstep(12.8, 16.3, t) * (1 - sstep(16.6, 17.0, t));
        if (tun > 0) {
          const tg = g.createRadialGradient(540, 900, lerp(900, 230, tun), 540, 900, lerp(1300, 760, tun));
          tg.addColorStop(0, "rgba(2,5,10,0)"); tg.addColorStop(1, `rgba(2,5,10,${0.95 * tun})`);
          g.fillStyle = tg; g.fillRect(0, 0, W, H);
        }
        const dim = sstep(T_GRAPH - 0.1, T_GRAPH + 0.35, t) * (1 - sstep(T_DRIFT - 0.3, T_DRIFT + 0.1, t));
        if (dim > 0) { g.fillStyle = `rgba(5,11,20,${0.88 * dim})`; g.fillRect(0, 0, W, H); }
        if (kb >= 0 && kb < 0.35) { g.fillStyle = `rgba(230,250,255,${0.7 * Math.exp(-kb * 10)})`; g.fillRect(0, 0, W, H); }
        const vg2 = g.createRadialGradient(540, 900, 600, 540, 900, 1250);
        vg2.addColorStop(0, "rgba(0,0,0,0)"); vg2.addColorStop(1, "rgba(0,0,0,0.45)");
        g.fillStyle = vg2; g.fillRect(0, 0, W, H);

        // labels pinned to the body
        const toScreen = (p) => [bodyM.a * p[0] + bodyM.c * p[1] + bodyM.e, bodyM.b * p[0] + bodyM.d * p[1] + bodyM.f];
        const place = (el, p, dx, dy, op) => {
          if (op <= 0.001) { el.style.opacity = "0"; return; }
          const s = toScreen(p);
          const x = clamp(s[0] + dx, 70, W - 70 - el.offsetWidth), y = clamp(s[1] + dy, 700, 1080);
          el.style.opacity = op.toFixed(3); el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
        };
        place(L.skin, P.hip, 90, -40, sstep(6.2, 6.5, t) * (1 - sstep(7.6, 7.85, t)));
        place(L.vapor, P.head, 80, -40, sstep(9.6, 9.9, t) * (1 - sstep(11.3, 11.55, t)));
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["space"] = new Promise((res) => {
        const im = new Image();
        im.onload = () => { earthImg = im; ready = true; renderAt(lastT); res(); };
        im.onerror = () => { ready = true; renderAt(lastT); res(); };
        im.src = "assets/tex/earth_day_4096.jpg";
      });
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DUR });
      window.__timelines["space"] = tl;
    })();
  </script>
</template>
