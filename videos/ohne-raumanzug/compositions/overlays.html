  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const enter = { duration: 0.3, ease: "power3.out" };
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const fmt = (v, d) => v.toFixed(d).replace(".", ",");

      // seconds in vacuum as the story runs: live, slow motion, time-lapse
      function vacClock(t) {
        const segs = [[4.95, 7.9, 1], [7.9, 11.6, 0.25], [11.6, 16.4, 2.318], [16.4, 22.4, 1], [22.4, 25.6, 21]];
        let c = 0;
        for (const [a, b, r] of segs) { if (t <= a) break; c += (Math.min(t, b) - a) * r; }
        return c;
      }
      function mode(t) {
        if (t < 4.95) return ["LIVE · IM RAUMANZUG", "#5fe3d0"];
        if (t < 7.9) return ["LIVE", "#ff6b5e"];
        if (t < 11.6) return ["ZEITLUPE ×0,25", "#8fdbff"];
        if (t < 16.4) return ["ZEITRAFFER ×2,3", "#ffb547"];
        if (t < 22.4) return ["LIVE", "#ff6b5e"];
        return ["ZEITRAFFER ×21", "#ffb547"];
      }
      const el = (id) => document.getElementById(id);
      const E = { clock: el("hud-clock"), press: el("hud-press"), modeT: el("hud-mode-t"), dot: el("hud-dot"),
        o2v: el("v-o2"), o2b: el("b-o2"), cv: el("v-cons"), cb: el("b-cons"), tv: el("v-temp"), tb: el("b-temp"),
        rO2: el("row-o2"), rC: el("row-cons"), rT: el("row-temp"), hudL: el("hud-left"), hudR: el("hud-right"), bars: el("hud-bars"), modeEl: el("hud-mode") };
      const proxy = { t: 0 };
      tl.fromTo(proxy, { t: 0 }, {
        t: 25.6, duration: 25.6, ease: "none",
        onUpdate: () => {
          const t = proxy.t, c = vacClock(t);
          E.clock.textContent = fmt(c, c < 20 ? 1 : 0);
          const p = t < 4.95 ? 29.6 : 29.6 * Math.pow(1 - clamp((t - 4.95) / 0.45, 0, 1), 2);
          E.press.textContent = fmt(p, 1);
          E.press.style.color = t < 4.95 ? "#ffffff" : "#ff6b5e";
          const m = mode(t); E.modeT.textContent = m[0]; E.dot.style.background = m[1];
          const o2 = clamp(98 - c * 4.2, 8, 98);
          E.o2v.textContent = Math.round(o2) + " %"; E.o2b.style.transform = `scaleX(${(o2 / 100).toFixed(3)})`;
          const cons = clamp(100 - Math.max(0, c - 9) * (100 / 6), 0, 100);
          E.cv.textContent = Math.round(cons) + " %"; E.cb.style.transform = `scaleX(${(cons / 100).toFixed(3)})`;
          E.cb.style.background = cons < 30 ? "#ff6b5e" : "#5fe3d0";
          const temp = 37.0 - Math.max(0, c - 17) * 0.0035;
          E.tv.textContent = fmt(temp, 1) + " °C"; E.tb.style.transform = `scaleX(${((temp - 30) / 7).toFixed(3)})`;
          const showBars = t >= 11.6;
          E.rO2.style.opacity = showBars ? "1" : "0"; E.rC.style.opacity = showBars ? "1" : "0";
          E.rT.style.opacity = t >= 17.0 ? "1" : "0";
          const g = t >= 19.1 && t < 22.45 ? 0 : 1;
          E.hudL.style.opacity = E.hudR.style.opacity = E.bars.style.opacity = String(g);
        },
      }, 0);

      // hook → poll
      tl.fromTo("#hook-h", { scale: 1 }, { scale: 1.04, duration: 2.5, ease: "none" }, 0);
      tl.to("#hook", { opacity: 0, duration: 0.12, ease: "power2.in" }, 2.45);
      tl.fromTo("#p1-t", { opacity: 0, y: 24 }, { opacity: 1, y: 0, ...enter }, 2.55);
      tl.fromTo("#p1-pills", { opacity: 0, y: 18 }, { opacity: 1, y: 0, ...enter }, 2.75);
      const cnt = document.getElementById("p1-count");
      tl.call(() => { cnt.textContent = "3"; }, null, 2.7);
      tl.call(() => { cnt.textContent = "2"; }, null, 3.45);
      tl.call(() => { cnt.textContent = "1"; }, null, 4.2);
      tl.set("#p1-count", { scale: 1 }, 0);
      tl.set("#p1-count", { scale: 1.25 }, 3.45);
      tl.to("#p1-count", { scale: 1, duration: 0.3, ease: "power2.out" }, 3.45);
      tl.set("#p1-count", { scale: 1.25 }, 4.2);
      tl.to("#p1-count", { scale: 1, duration: 0.3, ease: "power2.out" }, 4.2);
      tl.to("#poll1", { opacity: 0, duration: 0.08 }, 4.95);
      // answer: NEIN
      tl.fromTo("#poll1", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 5.9);
      tl.to("#p1-count", { opacity: 0, duration: 0.01 }, 5.9);
      tl.fromTo("#p1-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 6.2);
      tl.to("#p1-ja", { opacity: 0.25, duration: 0.2 }, 6.25);
      tl.fromTo("#p1-nein", { scale: 1, boxShadow: "0 0 0 rgba(255,107,94,0)" }, { scale: 1.15, background: "#ff6b5e", color: "#ffffff", boxShadow: "0 0 40px rgba(255,107,94,0.75)", duration: 0.3, ease: "back.out(2)" }, 6.3);
      tl.to("#poll1", { opacity: 0, duration: 0.15, ease: "power2.in" }, 7.65);

      // 10–15 s
      tl.fromTo("#secs-n", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 14.2);
      tl.fromTo("#secs-s", { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...enter }, 14.45);
      tl.to("#secs", { opacity: 0, duration: 0.15, ease: "power2.in" }, 16.3);

      // poll 2
      tl.fromTo("#p2-t", { opacity: 0, y: 24 }, { opacity: 1, y: 0, ...enter }, 16.95);
      tl.fromTo("#poll2 .pills", { opacity: 0, y: 18 }, { opacity: 1, y: 0, ...enter }, 17.15);
      tl.fromTo("#p2-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.inOut" }, 18.45);
      tl.to("#p2-ja", { opacity: 0.25, duration: 0.2 }, 18.45);
      tl.fromTo("#p2-nein", { scale: 1 }, { scale: 1.15, background: "#ff6b5e", color: "#ffffff", boxShadow: "0 0 40px rgba(255,107,94,0.75)", duration: 0.3, ease: "back.out(2)" }, 18.5);
      tl.to("#poll2", { opacity: 0, duration: 0.15, ease: "power2.in" }, 19.0);

      // chart
      tl.fromTo("#g-k", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 19.25);
      tl.fromTo("#g-b1", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, 19.5);
      tl.fromTo(["#g-l1", "#g-v1"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 19.6);
      tl.fromTo("#g-b2", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 20.3);
      tl.fromTo(["#g-l2", "#g-v2"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 20.4);
      tl.fromTo("#g-note", { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...enter }, 21.0);
      tl.to("#graph", { opacity: 0, duration: 0.2, ease: "power2.in" }, 22.2);

      // deadly
      tl.fromTo("#deadly-k", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 23.9);
      tl.fromTo("#deadly-h", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 24.5);
      tl.to("#deadly", { opacity: 0, duration: 0.15, ease: "power2.in" }, 25.45);

      // payoff
      tl.fromTo("#myth", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 25.6);
      tl.fromTo("#m-s1", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.inOut" }, 25.95);
      tl.fromTo("#m-s2", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.inOut" }, 26.25);
      tl.fromTo("#myth-h", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 26.6);
      tl.to("#myth", { opacity: 0, duration: 0.2, ease: "power2.in" }, 27.6);
      tl.fromTo("#chan-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, ...enter }, 27.7);
      tl.fromTo("#chan-h", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 27.85);
      tl.fromTo("#chan-s", { opacity: 0, y: 16 }, { opacity: 1, y: 0, ...enter }, 28.5);
      window.__timelines["overlays"] = tl;
    })();
  </script>
