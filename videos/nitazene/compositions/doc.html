          const c = document.createElement("canvas"); c.width = 180; c.height = 90; const x = c.getContext("2d"); x.drawImage(im, 0, 0, 180, 90);
          const d = x.getImageData(0, 0, 180, 90).data;
          for (let j = 4; j < 80; j++) for (let i = 0; i < 180; i++) if (d[(j * 180 + i) * 4] < 110) mapDots.push({ x: 60 + i * 5.33, y: 620 + j * 5.33 });
          ready = true; renderAt(lastT); res();
        };
        im.onerror = () => { ready = true; renderAt(lastT); res(); };
        im.src = "assets/tex/earth_specular_2048.jpg";
      });

      const tl = gsap.timeline({ paused: true }); tl.to({}, { duration: DUR }); window.__timelines["doc"] = tl;
    })();
