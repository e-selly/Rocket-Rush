<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #02040a;
        --ink: #ffffff;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="64" data-width="1080" data-height="1920">
      <!-- Scenes -->
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html" data-start="0" data-duration="64"
        data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="overlays" data-composition-id="overlays" data-composition-src="compositions/overlays.html" data-start="0" data-duration="64"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="64"
        data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- Voice (ElevenLabs, Thomas) -->
      <audio id="a-voice" class="clip" src="assets/audio/voice.mp3" data-start="0" data-duration="60.52" data-track-index="10" data-volume="1"></audio>

      <!-- Ambient bed (loopable drone, 30 s) -->
      <audio id="a-bed-1" class="clip" src="assets/audio/drone.mp3" data-start="0" data-duration="30" data-track-index="11" data-volume="0.2" data-fade-in="0.4"></audio>
      <audio id="a-bed-2" class="clip" src="assets/audio/drone.mp3" data-start="30" data-duration="30" data-track-index="11" data-volume="0.2"></audio>
      <audio id="a-bed-3" class="clip" src="assets/audio/drone.mp3" data-start="60" data-duration="4" data-track-index="11" data-volume="0.2" data-fade-out="2"></audio>

      <!-- Effects: peaks land one frame after the picture -->
      <audio id="a-impact" class="clip" src="assets/audio/impact.mp3" data-start="3.05" data-duration="4" data-track-index="12" data-volume="0.9"></audio>
      <audio id="a-wh-01" class="clip" src="assets/audio/whoosh2.mp3" data-start="0.84" data-duration="1.48" data-track-index="13" data-volume="0.45"></audio>
      <audio id="a-wh-02" class="clip" src="assets/audio/whoosh1.mp3" data-start="1.81" data-duration="1.0" data-track-index="17" data-volume="0.45"></audio>
      <audio id="a-wh-03" class="clip" src="assets/audio/whoosh2.mp3" data-start="5.04" data-duration="1.48" data-track-index="13" data-volume="0.4"></audio>
      <audio id="a-wh-04" class="clip" src="assets/audio/whoosh1.mp3" data-start="12.81" data-duration="1.0" data-track-index="17" data-volume="0.4"></audio>
      <audio id="a-wh-05" class="clip" src="assets/audio/whoosh2.mp3" data-start="20.24" data-duration="1.48" data-track-index="13" data-volume="0.4"></audio>
      <audio id="a-wh-06" class="clip" src="assets/audio/whoosh1.mp3" data-start="29.61" data-duration="1.0" data-track-index="17" data-volume="0.4"></audio>
      <audio id="a-wh-07" class="clip" src="assets/audio/whoosh2.mp3" data-start="42.44" data-duration="1.48" data-track-index="13" data-volume="0.35"></audio>
      <audio id="a-wind" class="clip" src="assets/audio/wind.mp3" data-start="16.4" data-duration="12" data-track-index="14" data-volume="0.45" data-fade-in="0.8" data-fade-out="1.6"></audio>
      <audio id="a-wave" class="clip" src="assets/audio/wave.mp3" data-start="26.1" data-duration="8" data-track-index="15" data-volume="0.65" data-fade-out="3"></audio>
      <audio id="a-riser" class="clip" src="assets/audio/riser.mp3" data-start="57.62" data-duration="6" data-track-index="16" data-volume="0.7" data-fade-out="1.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
