<template>
  <style>
    #root {
      position: absolute;

    #world-canvas {

      display: block;

    #world-flash {

    #world-shock {
      position: absolute;
      left: 0;
      top: 0;
      width: 1000px;
      height: 1000px;
      border-radius: 50%;
      border: 10px solid rgba(190, 230, 255, 0.9);
      box-shadow: 0 0 60px rgba(150, 210, 255, 0.8), inset 0 0 60px rgba(150, 210, 255, 0.6);
      opacity: 0;
      pointer-events: none;
    }
    .world-label {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "Inter", sans-serif;
      font-weight: 900;
      font-size: 40px;
      letter-spacing: 0.12em;
      color: #ffffff;
      white-space: nowrap;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 3px rgba(0, 0, 0, 0.9);

      background: #ffb547;
      box-shadow: 0 0 0 6px rgba(255, 181, 71, 0.25);
    }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920" data-duration="64" data-layout-allow-overflow>
    <canvas id="world-canvas" width="1080" height="1920"></canvas>
    <div id="world-shock"></div>
    <div id="world-flash"></div>
    <div id="lbl-equator" class="world-label"><span class="dot"></span>ÄQUATOR</div>
    <div id="lbl-polar" class="world-label"><span class="dot"></span>POLAROZEAN</div>
    <div id="lbl-continent" class="world-label amber"><span class="dot"></span>NEUER KONTINENT</div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script>
    (function () {
      const W = 1080, H = 1920, D2R = Math.PI / 180, DUR = 64;
      const canvas = document.getElementById("world-canvas");
      const flashEl = document.getElementById("world-flash");
      const shockEl = document.getElementById("world-shock");
      const labels = {
        equator: document.getElementById("lbl-equator"),
        polar: document.getElementById("lbl-polar"),
        continent: document.getElementById("lbl-continent"),
      };

      // ---------- helpers ----------
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, u) => a + (b - a) * u;
      const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
      const easeIO = (u) => { u = clamp(u, 0, 1); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const easeOut = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
      const dir = (latDeg, lonDeg) => {
        const la = latDeg * D2R, lo = lonDeg * D2R;
        return new THREE.Vector3(Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo));
      };
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // half horizontal field of view for vertical fov 30 at 9:16
      const FOV = 30;
      const HFOV_T = Math.tan((FOV / 2) * D2R) * (W / H);
      const distForWidth = (f) => 1 / Math.sin(Math.atan(f * HFOV_T));

      // ---------- rates integrated into angles (deterministic tables) ----------
      function spinRate(t) {
        if (t < 3.25) return 1.1;
        if (t < 3.37) return 1.1 * (1 - (t - 3.25) / 0.12);
        if (t < 5.2) return 0;
        if (t < 13) return 0.22;
        if (t < 16.4) return 0.05;
        if (t < 55.0) return 0;
        return 0.1 * sstep(55.0, 57.5, t);
      }
      function cloudRate(t) {
        if (t < 3.25) return 0;
        if (t < 5.2) return 0.5 * (1 - sstep(3.25, 5.2, t) * 0.6);
        if (t < 16.4) return 0;
        if (t < 29.8) return 0.2 * sstep(16.4, 17.4, t);
        if (t < 51) return 0.02;
        return 0;
      }
      const STEP = 1 / 240, N = Math.ceil(DUR / STEP) + 2;
      const spinTab = new Float32Array(N), cloudTab = new Float32Array(N);
      for (let i = 1; i < N; i++) {
        const tm = (i - 0.5) * STEP;
        spinTab[i] = spinTab[i - 1] + spinRate(tm) * STEP;
        cloudTab[i] = cloudTab[i - 1] + cloudRate(tm) * STEP;
      }
      const look = (tab, t) => { const x = clamp(t / STEP, 0, N - 2); const i = Math.floor(x); return lerp(tab[i], tab[i + 1], x - i); };
      const gSpin = (t) => look(spinTab, t);
      const gCloud = (t) => look(cloudTab, t);

      // ---------- renderer ----------
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x02040a, 1);
      renderer.autoClear = true;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.005, 200);

      const loader = new THREE.TextureLoader();
      const loadTex = (src, repeatX) =>
        new Promise((res, rej) => loader.load(src, (tx) => {
          tx.wrapS = THREE.RepeatWrapping; tx.wrapT = THREE.ClampToEdgeWrapping;
          tx.anisotropy = 8; tx.minFilter = THREE.LinearMipmapLinearFilter; tx.magFilter = THREE.LinearFilter;
          res(tx);
        }, undefined, rej));

      // ---------- shared GLSL ----------
      const COMMON = `
        #define PI 3.14159265359
        vec2 sphUV(vec3 n){ return vec2(atan(n.x, n.z)/(2.0*PI)+0.5, asin(clamp(n.y,-1.0,1.0))/PI+0.5); }
        vec4 samp(sampler2D tx, vec2 uv){
          vec2 dx = dFdx(uv), dy = dFdy(uv);
          if (abs(dx.x) > 0.5) dx.x -= sign(dx.x);
          if (abs(dy.x) > 0.5) dy.x -= sign(dy.x);
          return textureGrad(tx, uv, dx, dy);
        }
        float h31(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
        float vnoise(vec3 x){
          vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
          return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x), mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x), f.y),
                     mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x), mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x), f.y), f.z);
        }
        float fbm3(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
        vec3 rotY(vec3 v, float a){ float c=cos(a), s=sin(a); return vec3(c*v.x + s*v.z, v.y, -s*v.x + c*v.z); }
        vec3 toLin(vec3 c){ return pow(c, vec3(2.2)); }
        vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
        vec3 outCol(vec3 c, float exposure){ return pow(aces(c*exposure), vec3(1.0/2.2)); }
      `;

      const VERT = `
        varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
        void main(){
          vObjN = normalize(position);
          vWorldN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`;

      // ---------- Earth ----------
      const earthMat = new THREE.ShaderMaterial({
        uniforms: {
          dayTex: { value: null }, nightTex: { value: null }, brcTex: { value: null }, specTex: { value: null },
          sunDir: { value: new THREE.Vector3(1, 0, 0) }, cloudRot: { value: 0 }, cloudOp: { value: 1 },
          redis: { value: 0 }, heat: { value: 0 }, frost: { value: 0 }, flood: { value: 0 },
          surgeLon: { value: 0 }, surge: { value: 0 }, detail: { value: 0 }, exposure: { value: 1.0 },
          nightAmt: { value: 1.0 }, earthRot: { value: 0 },
        },
        vertexShader: VERT,
        fragmentShader: `
          ${COMMON}
          uniform sampler2D dayTex, nightTex, brcTex, specTex;
          uniform vec3 sunDir; uniform float cloudRot, cloudOp, redis, heat, frost, flood, surgeLon, surge, detail, exposure, nightAmt, earthRot;
          varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
          void main(){
            vec3 n = normalize(vObjN);
            vec3 N = normalize(vWorldN);
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec2 uv = sphUV(n);
            vec3 day = toLin(samp(dayTex, uv).rgb);
            vec3 night = toLin(samp(nightTex, uv).rgb);
            vec3 brc = samp(brcTex, uv).rgb;
            float ocean = smoothstep(0.35, 0.65, samp(specTex, uv).r);
            float elev = brc.r;
            float dn = 0.0;
            if (detail > 0.0) { dn = (fbm3(n*260.0) - 0.5) * detail; day *= 1.0 + dn*0.9; }

            // --- redistribution of the oceans (no centrifugal bulge) ---
            float s2 = n.y*n.y;
            float sea = redis * (2.3*s2 - 0.98);
            float depth = 0.25 + 0.75*fbm3(n*5.0 + 3.1);
            float height = mix(elev*0.9 + 0.03, -depth, ocean);
            float water = smoothstep(sea + 0.015, sea - 0.015, height);
            vec3 seafloor = mix(vec3(0.36,0.31,0.25), vec3(0.62,0.56,0.47), fbm3(n*40.0+dn));
            seafloor = mix(seafloor, vec3(0.80,0.78,0.72), smoothstep(0.62, 0.8, fbm3(n*90.0)) * 0.6);
            seafloor = toLin(seafloor);
            vec3 newWater = mix(vec3(0.006,0.03,0.075), vec3(0.03,0.13,0.2), smoothstep(-0.25, 0.0, height - sea));
            vec3 landCol = mix(day, seafloor, ocean);
            vec3 waterCol = mix(newWater, day, ocean);
            vec3 albedo = mix(landCol, waterCol, water);

            // --- coastal flooding and ocean surge ---
            float lon = atan(n.x, n.z);
            float dl = mod(lon - surgeLon + PI, 2.0*PI) - PI;
            float latFade = smoothstep(0.8, 0.45, abs(n.y));
            float dlw = dl + 0.05*sin(n.y*9.0 + surgeLon*2.0) + 0.04*(fbm3(n*9.0) - 0.5);
            float front = surge * exp(-pow(dlw/0.045, 2.0)) * ocean * latFade * smoothstep(0.35, 0.75, fbm3(n*55.0 + 2.0));
            float wake = surge * smoothstep(-0.45, 0.0, dlw) * step(dlw, 0.0) * ocean * latFade;
            float turb = fbm3(n*70.0 + vec3(surgeLon*3.0));
            albedo = mix(albedo, toLin(vec3(0.5,0.58,0.62)), clamp(front*0.9 + wake*0.35*smoothstep(0.5, 0.8, turb), 0.0, 1.0));
            float lowLand = (1.0 - ocean) * smoothstep(0.16, 0.0, elev) * step(abs(n.y), 0.85);
            albedo = mix(albedo, toLin(vec3(0.22,0.24,0.22)), lowLand * flood * 0.85);

            // --- light ---
            float ndl = dot(N, sunDir);
            float diff = smoothstep(-0.08, 0.35, ndl) * (0.25 + 0.75*clamp(ndl, 0.0, 1.0));
            // cloud shadows
            vec3 cn = rotY(n, -cloudRot);
            float cl = samp(brcTex, sphUV(cn + N*0.0)).b;
            float shadow = 1.0 - 0.45*cl*cloudOp;
            vec3 col = albedo * diff * shadow * 1.6;

            // heat on the permanent day side, frost on the night side
            float dayside = smoothstep(0.1, 0.7, ndl);
            vec3 scorched = toLin(vec3(0.62, 0.36, 0.17));
            col = mix(col, scorched * diff * 1.9, heat * dayside * (1.0 - water) * 0.75);
            col += heat * dayside * vec3(0.12, 0.05, 0.0) * diff;
            float nightside = 1.0 - smoothstep(-0.25, 0.02, ndl);
            vec3 ice = toLin(vec3(0.78, 0.88, 0.98));
            col = mix(col, ice * (0.09 + 0.05*fbm3(n*30.0)), frost * nightside);

            // sun glint on water
            vec3 Hh = normalize(sunDir + V);
            float nh = max(dot(N, Hh), 0.0);
            float spec = (pow(nh, 900.0) * 0.9 + pow(nh, 60.0) * 0.05) * water * smoothstep(0.0, 0.2, ndl);
            col += vec3(1.0, 0.92, 0.78) * spec * (1.0 - heat*0.5);

            // city lights on the dark side
            float dark = 1.0 - smoothstep(-0.12, 0.08, ndl);
            col += night * dark * (1.0 - water) * nightAmt * 2.6 * (1.0 - frost*0.7);
            col += dark * (1.0 - water) * night * 0.0;

            // atmosphere in front of the surface
            float mu = clamp(dot(N, V), 0.0, 1.0);
            float rim = pow(clamp(1.0 - mu, 0.0, 1.0), 3.0);
            float lit = smoothstep(-0.25, 0.4, ndl);
            vec3 atm = mix(vec3(0.18, 0.42, 1.0), vec3(0.55, 0.78, 1.0), rim);
            col = mix(col, atm * lit * 1.1, rim * 0.75 * lit + 0.04*lit);

            gl_FragColor = vec4(outCol(col, exposure), 1.0);
          }`,
      });
      const earthGeo = new THREE.SphereGeometry(1, 256, 128);
      const earth = new THREE.Mesh(earthGeo, earthMat);
      scene.add(earth);

      // ---------- Clouds ----------
      const cloudMat = new THREE.ShaderMaterial({
        uniforms: {
          brcTex: { value: null }, sunDir: { value: new THREE.Vector3(1, 0, 0) }, cloudRot: { value: 0 },
          streak: { value: 0 }, cloudOp: { value: 1 }, detail: { value: 0 }, exposure: { value: 1 },
          bolts: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
          heat: { value: 0 },
        },
        transparent: true, depthWrite: false,
        vertexShader: VERT,
        fragmentShader: `
          ${COMMON}
          uniform sampler2D brcTex; uniform vec3 sunDir; uniform float cloudRot, streak, cloudOp, detail, exposure, heat;
          uniform vec4 bolts[4];
          varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
          void main(){
            vec3 n0 = normalize(vObjN);
            vec3 n = rotY(n0, -cloudRot);
            vec2 uv = sphUV(n);
            float c = 0.0;
            if (streak > 0.001) {
              float L = 0.03 * streak;
              float j = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
              float wsum = 0.0;
              for (int i = 0; i < 14; i++) { float k = (float(i) + j)/14.0; float w = 1.0 - k*0.6; c += samp(brcTex, uv - vec2(L*k, 0.0)).b * w; wsum += w; }
              c /= wsum; c *= 1.15;
            } else {
              c = samp(brcTex, uv).b;
            }
            if (detail > 0.0) {
              float d = fbm3(n*vec3(180.0, 380.0, 180.0) + vec3(cloudRot*40.0, 0.0, 0.0));
              c = clamp(c * (0.55 + 0.9*d*detail + (1.0-detail)*0.45), 0.0, 1.0);
            }
            c = smoothstep(0.05, 0.9, c) * cloudOp * (1.0 - heat*0.6);
            vec3 N = normalize(vWorldN);
            vec3 V = normalize(cameraPosition - vWorldPos);
            float ndl = dot(N, sunDir);
            float lit = smoothstep(-0.12, 0.45, ndl);
            vec3 tint = mix(vec3(1.0, 0.55, 0.32), vec3(1.0, 0.98, 0.95), smoothstep(0.0, 0.35, ndl));
            vec3 col = tint * (0.03 + lit*1.35);
            float glow = 0.0;
            for (int i = 0; i < 4; i++) {
              float dd = distance(n0, bolts[i].xyz);
              glow += bolts[i].w * (exp(-dd*dd*9000.0)*3.0 + exp(-dd*dd*700.0)*0.8);
            }
            col += vec3(0.75, 0.82, 1.0) * glow * 2.5;
            float a = clamp(c + glow*0.6, 0.0, 1.0);
            float mu = clamp(dot(N, V), 0.0, 1.0);
            a *= smoothstep(0.0, 0.03, mu);
            gl_FragColor = vec4(outCol(col, exposure), a);
          }`,
      });
      const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.008, 256, 128), cloudMat);
      scene.add(clouds);

      // ---------- Motion lines / wind streaks shell (world-fixed) ----------
      const linesMat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 }, lines: { value: 0 }, wind: { value: 0 }, sunDir: { value: new THREE.Vector3() }, phase: { value: 0 } },
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: VERT,
        fragmentShader: `
          ${COMMON}
          uniform float time, lines, wind, phase; uniform vec3 sunDir;
          varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
          float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          void main(){
            vec3 n = normalize(vObjN);
            float lat = asin(n.y) / (PI/180.0);
            float lon = atan(n.x, n.z) / (PI/180.0);
            vec3 N = normalize(vWorldN); vec3 V = normalize(cameraPosition - vWorldPos);
            float mu = clamp(dot(N, V), 0.0, 1.0);
            float edge = smoothstep(0.0, 0.35, mu);
            vec3 col = vec3(0.0);
            if (lines > 0.0) {
              float spacing = 15.0;
              float d = abs(fract(lat/spacing + 0.5) - 0.5) * spacing;
              float fw = fwidth(lat) * 1.2 + 0.0001;
              float isEq = 1.0 - smoothstep(0.0, 1.0, abs(lat));
              float w = mix(0.22, 0.6, isEq);
              float ring = 1.0 - smoothstep(w, w + fw, d);
              float speed = cos(lat*PI/180.0);
              float ph = fract(lon/45.0 - phase*speed);
              float dash = pow(ph, 4.0) * smoothstep(1.0, 0.97, ph);
              float base = 0.08 + 0.9*dash;
              float band = step(abs(lat), 62.0);
              col += vec3(0.55, 0.88, 1.0) * ring * base * band * mix(0.8, 2.2, isEq) * lines;
            }
            if (wind > 0.0) {
              vec2 cell = vec2(floor(lon/7.0), floor(lat/2.2));
              float r = h21(cell);
              if (abs(lat) < 70.0) {
                float yc = (cell.y + 0.2 + 0.6*h21(cell+3.1)) * 2.2;
                float dy = abs(lat - yc);
                float fw = fwidth(lat) + 0.0001;
                float thick = 1.0 - smoothstep(0.04, 0.04 + fw*1.5, dy);
                float ph = fract((lon/7.0) - time*(0.9 + 0.8*r)*cos(lat*PI/180.0) - r*7.0);
                float seg = smoothstep(0.0, 0.6, ph) * (1.0 - smoothstep(0.85, 1.0, ph));
                float on = step(0.6, h21(cell+7.7));
                col += vec3(0.85, 0.93, 1.0) * thick * seg * on * 0.42 * wind;
              }
            }
            gl_FragColor = vec4(col * edge, 1.0);
          }`,
      });
      const linesShell = new THREE.Mesh(new THREE.SphereGeometry(1.016, 192, 96), linesMat);
      scene.add(linesShell);

      // ---------- Atmosphere halo ----------
      const atmoMat = new THREE.ShaderMaterial({
        uniforms: { sunDir: { value: new THREE.Vector3() }, strength: { value: 1 }, heat: { value: 0 } },
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        vertexShader: VERT,
        fragmentShader: `
          uniform vec3 sunDir; uniform float strength, heat;
          varying vec3 vObjN; varying vec3 vWorldN; varying vec3 vWorldPos;
          void main(){
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 N = normalize(vWorldN);
            float d = dot(-N, V);
            float g = pow(clamp(d, 0.0, 1.0), 7.0) * 1.15;
            float lit = smoothstep(-0.35, 0.5, dot(normalize(vWorldPos), sunDir));
            vec3 c = mix(vec3(0.25, 0.5, 1.0), vec3(1.0, 0.6, 0.35), heat*0.6) * g * (0.06 + lit) * strength;
            gl_FragColor = vec4(c, 1.0);
          }`,
      });
      const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.045, 128, 64), atmoMat);
      scene.add(atmo);

      // ---------- Stars ----------
      const rnd = mulberry32(20261025);
      const SN = 4200, sPos = new Float32Array(SN * 3), sSize = new Float32Array(SN), sCol = new Float32Array(SN * 3);
      for (let i = 0; i < SN; i++) {
        const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = Math.sqrt(1 - u * u);
        sPos[i * 3] = r * Math.cos(th) * 90; sPos[i * 3 + 1] = u * 90; sPos[i * 3 + 2] = r * Math.sin(th) * 90;
        const m = Math.pow(rnd(), 6);
        sSize[i] = 1.2 + m * 3.6;
        const temp = rnd();
        sCol[i * 3] = 0.8 + 0.2 * temp; sCol[i * 3 + 1] = 0.85 + 0.1 * temp; sCol[i * 3 + 2] = 1.0 - 0.2 * temp;
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
      starGeo.setAttribute("size", new THREE.BufferAttribute(sSize, 1));
      starGeo.setAttribute("color", new THREE.BufferAttribute(sCol, 3));
      const starMat = new THREE.ShaderMaterial({
        uniforms: { op: { value: 1 } },
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: `attribute float size; attribute vec3 color; varying vec3 vC; varying float vB;
          void main(){ vC = color; vB = clamp((size-1.0)/3.0, 0.15, 1.0);
            vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = size; gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform float op; varying vec3 vC; varying float vB;
          void main(){ vec2 p = gl_PointCoord - 0.5; float d = length(p); float a = smoothstep(0.5, 0.0, d);
            gl_FragColor = vec4(vC * a * vB * op, 1.0); }`,
      });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

        linesMat.uniforms.wind.value = s.wind;
        linesMat.uniforms.time.value = t;
        linesMat.uniforms.phase.value = t * 0.55;
        linesShell.visible = s.lines > 0 || s.wind > 0;
        atmoMat.uniforms.sunDir.value.copy(s.sunDir);
        atmoMat.uniforms.heat.value = s.heat;
        moonMat.uniforms.sunDir.value.copy(s.sunDir);
        moon.visible = s.moon;
        starMat.uniforms.op.value = s.starsOp;

        const c = s.cam;
        camera.fov = c.fov;
        camera.position.copy(c.pos);
        camera.up.copy(c.up);
        camera.lookAt(c.target);
        if (shakeAmp > 0) {
          const k = Math.floor(t * 30);
          const r1 = mulberry32(k * 7 + 1)(), r2 = mulberry32(k * 13 + 5)();
          camera.rotateX((r1 - 0.5) * 0.02 * shakeAmp);
          camera.rotateY((r2 - 0.5) * 0.02 * shakeAmp);
        }
        camera.setViewOffset(W, H, 0, c.yShift, W, H);
        camera.updateProjectionMatrix();

        sun.visible = s.sunOp > 0;
        sunMat.uniforms.op.value = s.sunOp;
        sun.position.copy(s.sunDir).multiplyScalar(40);
        sun.scale.setScalar(16);
        sun.lookAt(camera.position);
        stars.position.copy(camera.position);
      }

      function renderState(s, t, target) {
        if (s.mode === "ocean") {
          oceanMat.uniforms.t.value = s.oceanT;
          oceanMat.uniforms.bolt.value = s.bolt || 0;
          renderer.setRenderTarget(oceanRT);
          renderer.render(oceanScene, quadCam);
          blitMat.uniforms.src.value = oceanRT.texture;
          renderer.setRenderTarget(target);
          renderer.render(blitScene, quadCam);
          return;
        }
        apply(s, t);
        renderer.setRenderTarget(target);
        renderer.render(scene, camera);
      }
      const blitScene = new THREE.Scene();
      const blitMat = new THREE.ShaderMaterial({
        uniforms: { src: { value: null } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: `uniform sampler2D src; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(src, vUv).rgb, 1.0); }`,
      });
      blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));

      const labelW = {};
      function placeLabels(s) {
        for (const key of Object.keys(labels)) {
          const el = labels[key], L = s.labels[key];
          if (!L || L.op <= 0.001) { el.style.opacity = "0"; continue; }
          tmpV.copy(L.p).project(camera);
          const x = (tmpV.x * 0.5 + 0.5) * W, y = (-tmpV.y * 0.5 + 0.5) * H;
          const lw = labelW[key] || (labelW[key] = el.offsetWidth || 420);
          const lx = clamp(x + (L.dx || 0), 70, W - 70 - lw);
          const ly = clamp(y + (L.dy || 0), 200, 1320);
          el.style.opacity = String(L.op);
          el.style.transform = `translate(${lx.toFixed(1)}px, ${ly.toFixed(1)}px)`;
        }
      }

      let ready = false;
      function renderAt(t) {
        if (!ready) return;
        t = clamp(t, 0, DUR - 1 / 60);
        const i = shotIndex(t);
        const sh = SHOTS[i];
        const sCur = sh.f(t);
        const xin = sh.xin || 0;
        let mixAB = 0;
        if (xin > 0 && t < sh.t0 + xin && i > 0) {
          const sPrev = SHOTS[i - 1].f(t);
          renderState(sPrev, t, rtA);
          renderState(sCur, t, rtB);
          mixAB = sstep(sh.t0, sh.t0 + xin, t);
          apply(sCur, t);
        } else {
          renderState(sCur, t, rtA);
        }
        if (sCur.mode !== "ocean") placeLabels(sCur); else placeLabels({ labels: {} });
        postMat.uniforms.tA.value = rtA.texture;
        postMat.uniforms.tB.value = rtB.texture;
        postMat.uniforms.mixAB.value = mixAB;
        postMat.uniforms.frame.value = Math.floor(t * 30);
        postMat.uniforms.ab.value = sCur.ab || 0;
        renderer.setRenderTarget(null);
        renderer.render(postScene, quadCam);

        // stop shock: flash + expanding atmosphere ring
        const k = t - 3.25;
        flashEl.style.opacity = k >= 0 && k < 0.4 ? String(0.85 * Math.exp(-k * 12)) : "0";
        if (k >= 0 && k < 0.9) {
          const sc = 0.95 + k * 1.4;
          shockEl.style.opacity = String(Math.max(0, 0.9 * (1 - k / 0.9)));
          shockEl.style.transform = `translate(40px, ${640 - 120}px) scale(${sc.toFixed(3)})`;
        } else shockEl.style.opacity = "0";
      }

      // ---------- load ----------
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = Promise.all([
        loadTex("assets/tex/earth_day_4096.jpg"),
        loadTex("assets/tex/earth_night_4096.jpg"),
        loadTex("assets/tex/earth_bump_roughness_clouds_4096.jpg"),
        loadTex("assets/tex/earth_specular_2048.jpg"),
        loadTex("assets/tex/moon_1024.jpg"),
      ]).then(([day, night, brc, spec, moonT]) => {
        earthMat.uniforms.dayTex.value = day;
        earthMat.uniforms.nightTex.value = night;
        earthMat.uniforms.brcTex.value = brc;
        earthMat.uniforms.specTex.value = spec;
        cloudMat.uniforms.brcTex.value = brc;
        moonMat.uniforms.moonTex.value = moonT;
        ready = true;
        renderAt(lastT);
      });

      let lastT = 0;
      window.addEventListener("hf-seek", (e) => {
        lastT = e.detail.time;
        renderAt(lastT);
      });

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DUR });
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
