      // ---------- close-up profile (2D, drawn over the warm background) ----------
      const PROF = [[-0.1, 0.02], [-0.085, 0.085], [-0.05, 0.12], [0.0, 0.132], [0.05, 0.118], [0.08, 0.085], [0.09, 0.045], [0.093, 0.022], [0.09, 0.008], [0.103, -0.018], [0.118, -0.04], [0.104, -0.05], [0.097, -0.057], [0.101, -0.068], [0.093, -0.076], [0.099, -0.086], [0.088, -0.098], [0.093, -0.117], [0.075, -0.132], [0.04, -0.135], [0.038, -0.16], [0.045, -0.24], [0.11, -0.3], [0.24, -0.4], [0.3, -0.62], [-0.42, -0.62], [-0.33, -0.36], [-0.16, -0.28], [-0.085, -0.19], [-0.075, -0.095], [-0.098, -0.035]];
      const pC = document.createElement("canvas"); pC.width = W; pC.height = H; const pg = pC.getContext("2d");

      function drawProfile(g, t) {
        const u = sstep(S.close, DUR, t);
        const sc = lerp(2350, 2480, u), cx = 470, cy = 720 + 6 * Math.sin(t * 0.6), breathe = 0.003 * Math.sin(t * 1.4);

      // ---------- render ----------
      const fx = document.getElementById("film-fx"); const g2 = fx.getContext("2d");
      const grain = [0, 1, 2, 3].map(() => { const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"); const im = x.createImageData(256, 256);

      function renderAt(t) {

          if (p2) { back.position.set(0.2, 3.4, -4.6); back.target.position.set(0, 0.8, -2.0); back.intensity = 22; }
          else { back.position.set(0.0, 3.2, 0.6); back.target.position.set(0.1, 1.5, -2.2); back.intensity = 20 * fade; }
          back.angle = 0.55;
          key.position.set(0.3, 3.1, 1.9); key.target.position.set(0, 1.2, 0.2); key.intensity = 4; key.angle = 0.42;

          paintFigure(hero, { kind: "hero", slump: lerp(1, 0, up), headDrop: lerp(0.06, 0, up), tilt: 0,
            rims: [{ color: COLD, dx: 0, dy: -7, a: lerp(0.55, 0.9, up) }, { color: "rgba(80,105,150,1)", blur: 10, a: 0.1 }] });

          rim.position.set(-1.1, 2.0, -1.4); rim.target.position.set(0, 1.4, z); rim.intensity = lerp(16, 6, wu);

          scene.fog.density = lerp(0.11, 0.08, wu); scene.fog.color.set(0x040507).lerp(new THREE.Color(0x1a0f08), wu);
        } else scene.fog.color.set(0x040507);
        if (sc === 6) {
          warm.position.set(1.7, 2.0, 1.4); warm.target.position.set(1.0, 1.2, -2.1); warm.intensity = 24; warm.angle = 0.6; warm.penumbra = 1;
          warmBeam.material.uniforms.amt.value = 0.14; scene.fog.density = 0.07; scene.fog.color.set(0x1a0f08);
          renderer.toneMappingExposure = lerp(1.0, 0.75, sstep(S.end - 0.2, S.end + 0.8, t));
        }

        // dust
        const dp = dustG.attributes.position;
        dustP.forEach((d, k) => { dp.setXYZ(k, d[0] + Math.sin(t * 0.15 + d[3]) * 0.12, ((d[1] + t * 0.03) % 3.0) + 0.05, d[2] + Math.cos(t * 0.11 + d[3]) * 0.1); });
        dp.needsUpdate = true; dustM.opacity = sc === 4 ? 0.7 : sc >= 5 ? 0.5 : 0.3; dustM.color.set(sc >= 5 ? 0xffd2a0 : 0xcfd8e6);

        renderer.render(scene, camera);

        // ---- 2D finish ----
        g2.clearRect(0, 0, W, H);
        if (sc === 6) { drawProfile(g2, t); const dim = sstep(S.end - 0.2, S.end + 0.8, t) * 0.35; if (dim > 0) { g2.fillStyle = `rgba(0,0,0,${dim})`; g2.fillRect(0, 0, W, H); } }
        if (sc === 1) {
          const sh = g2.createLinearGradient(0, 300, 1080, 1500); sh.addColorStop(0, "rgba(180,200,230,0)"); sh.addColorStop(0.45, `rgba(180,200,230,${0.07 * (1 - sstep(1.5, 3.5, t))})`); sh.addColorStop(0.55, "rgba(180,200,230,0)");

        }

        g2.fillStyle = vg; g2.fillRect(0, 0, W, H);

        for (let y = 0; y < H; y += 256) for (let x = 0; x < W; x += 256) g2.drawImage(gt, x, y);
        g2.globalAlpha = 1;
        let dip = 0; for (const c of [S.c1, S.c2, S.c3, S.c4, S.close]) { const d = Math.abs(t - c); if (d < 0.22) dip = Math.max(dip, 1 - d / 0.22); }
        dip = Math.max(dip, 1 - sstep(0, 0.25, t));

      }

      let lastT = 0;
      renderAt(0);
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
      const tl = gsap.timeline({ paused: true }); tl.to({}, { duration: DUR }); window.__timelines["film"] = tl;
    })();
