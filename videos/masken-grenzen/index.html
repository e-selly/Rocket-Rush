<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root { --ground: #030405; --ink: #ffffff; --font-display: "Inter", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920">
      <div id="film" data-composition-id="film" data-composition-src="compositions/film.html" data-start="0" data-duration="35"
        data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="overlays" data-composition-id="overlays" data-composition-src="compositions/overlays.html" data-start="0" data-duration="35"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="35"
        data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- Voice (local German TTS) -->
      <audio id="a-voice" class="clip" src="assets/audio/voice.mp3" data-start="0.25" data-duration="31.85" data-track-index="10" data-volume="1"></audio>
      <!-- Dark piano score and ambient bed -->
      <audio id="a-piano" class="clip" src="assets/audio/piano.mp3" data-start="0" data-duration="35" data-track-index="11" data-volume="0.42" data-fade-out="1.5"></audio>
      <audio id="a-bed-1" class="clip" src="assets/audio/drone.mp3" data-start="0" data-duration="30" data-track-index="12" data-volume="0.2" data-fade-in="0.5"></audio>
      <audio id="a-bed-2" class="clip" src="assets/audio/drone.mp3" data-start="30" data-duration="5" data-track-index="12" data-volume="0.2" data-fade-out="2"></audio>
      <!-- Sound design -->
      <audio id="a-sfx-00" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="0.2" data-duration="2.1" data-track-index="13" data-volume="0.3"></audio>
      <audio id="a-sfx-01" class="clip" src="assets/audio/whoosh1.mp3" data-start="3.6" data-duration="1.0" data-track-index="13" data-volume="0.14"></audio>
      <audio id="a-sfx-02" class="clip" src="assets/audio/whoosh2.mp3" data-start="8.9" data-duration="1.5" data-track-index="13" data-volume="0.14"></audio>
      <audio id="a-sfx-03" class="clip" src="assets/audio/impact-bass-2.mp3" data-start="16.7" data-duration="2.0" data-track-index="13" data-volume="0.28"></audio>
      <audio id="a-sfx-04" class="clip" src="assets/audio/shatter0.mp3" data-start="20.27" data-duration="1.6" data-track-index="14" data-volume="0.5"></audio>
      <audio id="a-sfx-05" class="clip" src="assets/audio/shatter1.mp3" data-start="21.11" data-duration="1.6" data-track-index="15" data-volume="0.45"></audio>
      <audio id="a-sfx-06" class="clip" src="assets/audio/shatter2.mp3" data-start="22.03" data-duration="1.6" data-track-index="14" data-volume="0.5"></audio>
      <audio id="a-sfx-07" class="clip" src="assets/audio/shatter0.mp3" data-start="22.86" data-duration="1.6" data-track-index="15" data-volume="0.45"></audio>
      <audio id="a-sfx-08" class="clip" src="assets/audio/shatter1.mp3" data-start="23.74" data-duration="1.6" data-track-index="14" data-volume="0.55"></audio>
      <audio id="a-sfx-09" class="clip" src="assets/audio/riser-end.mp3" data-start="26.25" data-duration="3.15" data-track-index="13" data-volume="0.18"></audio>
      <audio id="a-sfx-10" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="29.42" data-duration="2.1" data-track-index="16" data-volume="0.4"></audio>
      <audio id="a-sfx-11" class="clip" src="assets/audio/impact-bass-2.mp3" data-start="33.45" data-duration="1.5" data-track-index="13" data-volume="0.25"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
