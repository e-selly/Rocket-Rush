<template>
  <style>
    #root { position: absolute; inset: 0; background: #05080f; overflow: hidden; }
    #city-gl, #city-fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
  <div id="root" data-composition-id="city" data-width="1080" data-height="1920" data-duration="40">
    <canvas id="city-gl" width="1080" height="1920"></canvas>
    <canvas id="city-fx" width="1080" height="1920"></canvas>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script>
    (function () {
      const W = 1080, H = 1920, DUR = 40;
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, u) => a + (b - a) * u;
      const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261025);
      const R = (a, b) => a + (b - a) * rnd();
      const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
      const C = (h) => new THREE.Color(h);

      // story beats in video seconds (voice starts at 0.2)
      const T = {
        off0: 3.9, off1: 7.2,          // city lights go out
        sig: 7.2, sigDead: 9.6,        // traffic lights blink, then die
        trainStop: 9.4,
        flood0: 11.9, flood1: 16.0,    // subway fills
        grass0: 16.3, grass1: 20.0,
        decay0: 18.9, decay1: 29.0,
        ivy0: 19.2, ivy1: 30.0,
        tree0: 21.7, tree1: 30.5,
        lapse0: 21.7, lapse1: 25.3,    // time-lapse day cycles
        coll0: 25.6, coll1: 30.0,      // towers crumble
        sun0: 30.0, sun1: 37.0,        // sunrise
      };

      // ---------- renderer ----------
      const gl = document.getElementById("city-gl");
      const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.localClippingEnabled = true;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0b1220, 0.02);
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 400);

      const sun = new THREE.DirectionalLight(0xffffff, 1);
      sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
      const sc = sun.shadow.camera; sc.left = -22; sc.right = 22; sc.top = 22; sc.bottom = -22; sc.near = 1; sc.far = 120;
      sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
      scene.add(sun, sun.target);
      const hemi = new THREE.HemisphereLight(0x1c2a44, 0x0a0d12, 0.6); scene.add(hemi);

      // ---------- canvas textures ----------
      function canvasTex(w, h, draw, srgb = true) {
        const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
        if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
      }
      // facade: one tile = 4 x 4 world units, 8 columns x 8 floors
      const facade = canvasTex(256, 256, (g) => {
        g.fillStyle = "#c9ccd0"; g.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(0,0,0,${R(0.02, 0.06)})`; g.fillRect(R(0, 256), R(0, 256), R(2, 10), R(2, 14)); }
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          g.fillStyle = "#3b4350"; g.fillRect(c * 32 + 7, r * 32 + 8, 18, 17);
          g.fillStyle = "rgba(255,255,255,0.10)"; g.fillRect(c * 32 + 7, r * 32 + 8, 18, 3);
        }
        g.fillStyle = "rgba(0,0,0,0.12)"; for (let r = 0; r < 8; r++) g.fillRect(0, r * 32 + 29, 256, 3);
      });
      const litMaps = [0, 1, 2, 3].map((k) => canvasTex(256, 256, (g) => {
        g.fillStyle = "#000"; g.fillRect(0, 0, 256, 256);
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (rnd() < 0.42) {
          const v = R(0.55, 1); g.fillStyle = `rgba(${255 * v | 0},${200 * v | 0},${130 * v | 0},1)`; g.fillRect(c * 32 + 7, r * 32 + 8, 18, 17);
        }
      }));
      // ivy coverage: noise + bottom-heavy gradient (value = how early it gets covered)
      const ivyMask = canvasTex(128, 256, (g, w, h) => {
        const im = g.createImageData(w, h);
        const n = []; for (let i = 0; i < 40 * 80; i++) n.push(rnd());
        const nz = (x, y) => { const xi = Math.floor(x) % 40, yi = Math.floor(y) % 80, fx = x - Math.floor(x), fy = y - Math.floor(y);
          const a = n[yi * 40 + xi], b = n[yi * 40 + (xi + 1) % 40], c2 = n[((yi + 1) % 80) * 40 + xi], d = n[((yi + 1) % 80) * 40 + (xi + 1) % 40];
          return lerp(lerp(a, b, fx), lerp(c2, d, fx), fy); };
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const v = 0.55 * nz(x / 9, y / 9) + 0.25 * nz(x / 3.5 + 7, y / 3.5) + 0.65 * (y / h) - 0.1; // canvas y down = texture bottom
          const q = clamp(v, 0, 1) * 255; const o = (y * w + x) * 4; im.data[o] = im.data[o + 1] = im.data[o + 2] = q; im.data[o + 3] = 255;
        }
        g.putImageData(im, 0, 0);
      }, false);
      const glowTex = canvasTex(64, 64, (g) => {
        const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,0.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      });

      // ---------- sky ----------
      const skyU = { top: { value: C(0x050912) }, hor: { value: C(0x16233a) }, sunDir: { value: V3(0, 0.1, -1) }, sunCol: { value: C(0xffb46a) }, sunAmt: { value: 0 } };
      const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
        uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
        vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: "uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; uniform float sunAmt; varying vec3 vD;" +
          "void main(){ float h = clamp(vD.y, 0.0, 1.0); vec3 c = mix(hor, top, pow(h, 0.55)); c = mix(c, hor, smoothstep(0.12, 0.0, vD.y)); float s = max(dot(normalize(vD), normalize(sunDir)), 0.0);" +
          "c += sunCol * sunAmt * smoothstep(0.0, 0.09, vD.y) * (pow(s, 900.0) * 1.4 + pow(s, 60.0) * 0.35 + pow(s, 8.0) * 0.12); gl_FragColor = vec4(c, 1.0); }",
      }));
      scene.add(sky);

      // ---------- city layout ----------
      const N = 7, BS = 3.2, P = 4.4, HALF = (N * P) / 2; // 30.8 wide city
      const bx = (i) => (i - (N - 1) / 2) * P;
      const PIT = { i: 4, j: 3 }; const pitX = bx(PIT.i), pitZ = bx(PIT.j);
      const PARKS = new Set(["1,5", "5,1"]);
      const TRAIN_Z = bx(3) + P / 2; // street between rows 3 and 4

      // ground outside the city: shape with a hole
      const outer = new THREE.Shape(); outer.moveTo(-290, -290); outer.lineTo(290, -290); outer.lineTo(290, 290); outer.lineTo(-290, 290);
      const hole = new THREE.Path(); hole.moveTo(-HALF, -HALF); hole.lineTo(-HALF, HALF); hole.lineTo(HALF, HALF); hole.lineTo(HALF, -HALF); outer.holes.push(hole);
      const outerMat = new THREE.MeshStandardMaterial({ color: 0x1a1f1c, roughness: 1 });
      const outerG = new THREE.Mesh(new THREE.ShapeGeometry(outer), outerMat); outerG.rotation.x = -Math.PI / 2; outerG.position.y = -0.01; outerG.receiveShadow = true; scene.add(outerG);
      // asphalt with a hole for the sunken station
      const city = new THREE.Shape(); city.moveTo(-HALF, -HALF); city.lineTo(HALF, -HALF); city.lineTo(HALF, HALF); city.lineTo(-HALF, HALF);
      const ph = new THREE.Path(); const hb = BS / 2; ph.moveTo(pitX - hb, -pitZ - hb); ph.lineTo(pitX - hb, -pitZ + hb); ph.lineTo(pitX + hb, -pitZ + hb); ph.lineTo(pitX + hb, -pitZ - hb); city.holes.push(ph);
      const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x2b2f34, roughness: 0.92 });
      const asphalt = new THREE.Mesh(new THREE.ShapeGeometry(city), asphaltMat); asphalt.rotation.x = -Math.PI / 2; asphalt.receiveShadow = true; scene.add(asphalt);

      // lane markings
      const markMat = new THREE.MeshStandardMaterial({ color: 0xb9bcc0, roughness: 0.8 });
      const marks = [];
      for (let k = 0; k <= N; k++) {
        const s = -HALF + k * P - (k === 0 ? -0.5 : k === N ? 0.5 : 0);
        for (let m = -HALF + 0.6; m < HALF - 0.6; m += 0.9) { marks.push([s, m, 0]); marks.push([m, s, 1]); }
      }
      const markI = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06, 0.012, 0.42), markMat, marks.length);
      const dm = new THREE.Object3D();
      marks.forEach((m, k) => { dm.position.set(m[0], 0.006, m[1]); dm.rotation.set(0, m[2] ? Math.PI / 2 : 0, 0); dm.updateMatrix(); markI.setMatrixAt(k, dm.matrix); });
      markI.receiveShadow = true; scene.add(markI);

      const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x8d9298, roughness: 0.9 });
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x5a5f66, roughness: 0.95 });
      const hiddenMat = new THREE.MeshBasicMaterial({ visible: false });
      const buildings = [];
      const treeSpots = []; // [x, y, z, size, t0, dur, kind]
      const grassSpots = [];
      const roofSpots = [];

      function addBuilding(x, z, w, d, h, tall) {
        const g = new THREE.BoxGeometry(w, h, d);
        const uv = g.attributes.uv, nrm = g.attributes.normal;
        for (let k = 0; k < uv.count; k++) {
          const nx = Math.abs(nrm.getX(k)), ny = Math.abs(nrm.getY(k));
          if (ny > 0.5) continue;
          const span = nx > 0.5 ? d : w;
          uv.setXY(k, uv.getX(k) * span / 4 + (x * 0.37 % 1), uv.getY(k) * h / 4);
        }
        const base = C([0xd6d2ca, 0xc4cad1, 0xb9b1a4, 0xd0cfcb, 0x9ea8b3][Math.floor(rnd() * 5)]).multiplyScalar(0.8);
        const cut = new THREE.Plane(V3(R(-0.12, 0.12), -1, R(-0.12, 0.12)).normalize(), h + 5);
        const side = new THREE.MeshStandardMaterial({ color: base.clone(), map: facade, emissive: 0xffc27a, emissiveMap: litMaps[Math.floor(rnd() * 4)], emissiveIntensity: 0, roughness: 0.85, clippingPlanes: [cut], side: THREE.DoubleSide, shadowSide: THREE.FrontSide });
        const roof = roofMat.clone(); roof.clippingPlanes = [cut];
        const m = new THREE.Mesh(g, [side, side, roof, hiddenMat, side, side]);
        m.position.set(x, 0.15 + h / 2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
        // ivy skin
        const ivyM = new THREE.MeshStandardMaterial({ color: C([0x2f5222, 0x3a6127, 0x2a4a1e][Math.floor(rnd() * 3)]), alphaMap: ivyMask, alphaTest: 0.999, roughness: 1, clippingPlanes: [cut], side: THREE.DoubleSide });
        const ig = new THREE.BoxGeometry(w + 0.04, h, d + 0.04);
        const iuv = ig.attributes.uv; for (let k = 0; k < iuv.count; k++) iuv.setX(k, iuv.getX(k) * Math.max(w, d) / 2.5);
        const ivy = new THREE.Mesh(ig, [ivyM, ivyM, hiddenMat, hiddenMat, ivyM, ivyM]); ivy.position.copy(m.position); ivy.castShadow = false; ivy.receiveShadow = true; scene.add(ivy);
        const collapse = tall && rnd() < 0.7;
        buildings.push({ m, ivy, side, ivyM, roof, cut, h, base, off: R(T.off0, T.off1), seed: R(0, 100), lit: R(0.8, 1.6),
          ivyStart: R(T.ivy0, T.ivy0 + 5), ivyMax: R(0.3, 0.58), collapse, cutTo: R(0.3, 0.65) * h, collT: R(T.coll0, T.coll1 - 1.5), x, z, w, d });
        if (h < 3.2 && rnd() < 0.7) roofSpots.push([x + R(-w, w) * 0.3, 0.15 + h, z + R(-d, d) * 0.3, R(0.25, 0.42)]);
      }

      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const cx = bx(i), cz = bx(j); const key = i + "," + j;
        if (i === PIT.i && j === PIT.j) continue;
        const slab = new THREE.Mesh(new THREE.BoxGeometry(BS, 0.15, BS), sidewalkMat); slab.position.set(cx, 0.075, cz); slab.receiveShadow = true; scene.add(slab);
        const dist = Math.hypot(cx, cz) / HALF;
        if (PARKS.has(key)) {
          const lawn = new THREE.Mesh(new THREE.BoxGeometry(BS - 0.3, 0.04, BS - 0.3), new THREE.MeshStandardMaterial({ color: 0x2f4a26, roughness: 1 }));
          lawn.position.set(cx, 0.17, cz); lawn.receiveShadow = true; scene.add(lawn);
          for (let k = 0; k < 9; k++) treeSpots.push([cx + R(-1.2, 1.2), 0.19, cz + R(-1.2, 1.2), R(0.28, 0.4), -1, 1, 0]);
          for (let k = 0; k < 14; k++) treeSpots.push([cx + R(-1.3, 1.3), 0.19, cz + R(-1.3, 1.3), R(0.25, 0.45), R(T.tree0, T.tree0 + 4), R(3, 6), 0]);
          continue;
        }
        const maxH = lerp(9.5, 2.2, clamp(dist, 0, 1)) * R(0.6, 1.1);
        const split = rnd();
        const lots = split < 0.3 ? [[0, 0, BS - 0.5, BS - 0.5]] : split < 0.65
          ? [[-0.8, 0, 1.3, BS - 0.5], [0.8, 0, 1.3, BS - 0.5]]
          : [[-0.8, -0.8, 1.3, 1.3], [0.8, -0.8, 1.3, 1.3], [-0.8, 0.8, 1.3, 1.3], [0.8, 0.8, 1.3, 1.3]];
        for (const L of lots) {
          const h = Math.max(1.0, maxH * R(0.45, 1.0) * (lots.length === 1 ? 1 : R(0.6, 1)));
          addBuilding(cx + L[0], cz + L[1], L[2] * R(0.85, 1), L[3] * R(0.85, 1), h, h > 5);
        }
      }
      // street trees and grass
      for (let k = 0; k <= N; k++) {
        const s = -HALF + k * P;
        for (let m = -HALF + 0.4; m < HALF; m += R(0.5, 1.4)) {
          if (rnd() < 0.55) treeSpots.push([s + R(-0.35, 0.35), 0.02, m, R(0.22, 0.42), R(T.tree0, T.tree1 - 3), R(3, 6), 0]);
          if (rnd() < 0.55) treeSpots.push([m, 0.02, s + R(-0.35, 0.35), R(0.22, 0.42), R(T.tree0, T.tree1 - 3), R(3, 6), 0]);
        }
        for (let m = -HALF; m < HALF; m += 0.22) for (const q of [0, 1]) {
          const a = s + R(-0.55, 0.55), b = m + R(-0.1, 0.1);
          grassSpots.push(q ? [b, a] : [a, b]);
        }
      }
      for (const r of roofSpots) treeSpots.push([r[0], r[1], r[2], r[3], R(T.coll0, T.tree1), R(3, 5), 0]);
      // outskirts forest (grows over the years)
      for (let k = 0; k < 2400; k++) {
        const a = R(0, Math.PI * 2), rr = HALF + 1 + Math.pow(rnd(), 0.75) * 110;
        const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
        if (Math.abs(x) < HALF + 0.5 && Math.abs(z) < HALF + 0.5) continue;
        const near = clamp((rr - HALF) / 110, 0, 1);
        treeSpots.push([x, 0, z, R(0.55, 1.15) * (1 + near * 0.8), rnd() < 0.18 ? -1 : R(T.tree0 - 1, T.tree1 - 2 + near * 2), R(3, 6), 1]);
      }

      // ---------- trees (instanced) ----------
      const NT = treeSpots.length;
      const canopyG = new THREE.IcosahedronGeometry(1, 1);
      const canopy = new THREE.InstancedMesh(canopyG, new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true }), NT);
      const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12, 0.18, 1, 6), new THREE.MeshStandardMaterial({ color: 0x4a3a2c, roughness: 1 }), NT);
      canopy.castShadow = trunk.castShadow = true; canopy.receiveShadow = true;
      const greens = [0x2f5a22, 0x3c6a28, 0x466f2b, 0x2a4f20, 0x557a30, 0x35602a];
      treeSpots.forEach((s, k) => { const c = C(greens[k % greens.length]); c.offsetHSL(R(-0.02, 0.02), 0, R(-0.04, 0.04)); canopy.setColorAt(k, c); });
      scene.add(canopy, trunk);
      function treeAt(t) {
        for (let k = 0; k < NT; k++) {
          const s = treeSpots[k]; const g = s[4] < 0 ? 1 : sstep(s[4], s[4] + s[5], t);
          const sz = s[3] * Math.max(g, 0.0001);
          dm.rotation.set(0, k * 1.7, 0);
          dm.position.set(s[0], s[1] + sz * 1.6, s[2]); dm.scale.set(sz * 1.05, sz * 1.15, sz * 1.05); dm.updateMatrix(); canopy.setMatrixAt(k, dm.matrix);
          dm.position.set(s[0], s[1] + sz * 0.5, s[2]); dm.scale.set(sz, sz * 1.0, sz); dm.updateMatrix(); trunk.setMatrixAt(k, dm.matrix);
        }
        canopy.instanceMatrix.needsUpdate = true; trunk.instanceMatrix.needsUpdate = true;
      }

      // ---------- grass tufts ----------
      const NG = grassSpots.length;
      const grass = new THREE.InstancedMesh(new THREE.ConeGeometry(0.11, 0.16, 5), new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true }), NG);
      const gStart = grassSpots.map(() => R(T.grass0, T.grass1));
      grassSpots.forEach((s, k) => { const c = C([0x4f7a2c, 0x5f8a33, 0x3f6a26, 0x6b8b3a][k % 4]); c.offsetHSL(0, 0, R(-0.05, 0.05)); grass.setColorAt(k, c); });
      grass.receiveShadow = true; scene.add(grass);
      function grassAt(t) {
        for (let k = 0; k < NG; k++) {
          const g = sstep(gStart[k], gStart[k] + 2.2, t); const s = grassSpots[k];
          const sc2 = Math.max(g, 0.0001) * (0.7 + (k % 7) * 0.12);
          dm.rotation.set(0, k, 0); dm.position.set(s[0], 0.08 * sc2, s[1]); dm.scale.set(sc2 * 1.4, sc2 * 1.2, sc2 * 1.4); dm.updateMatrix(); grass.setMatrixAt(k, dm.matrix);
        }
        grass.instanceMatrix.needsUpdate = true;
      }

      // ---------- cars (stopped where they were) ----------
      const cars = [];
      for (let k = 0; k < 46; k++) {
        const along = rnd() < 0.5; const line = -HALF + Math.floor(R(1, N)) * P; const pos = R(-HALF + 1, HALF - 1);
        const lane = rnd() < 0.5 ? -0.28 : 0.28;
        if (along && Math.abs(line - TRAIN_Z) < 0.1) continue;
        cars.push({ x: along ? pos : line + lane, z: along ? line + lane : pos, rot: along ? 0 : Math.PI / 2, ang: R(-0.25, 0.25) });
      }
      const carBody = new THREE.InstancedMesh(new THREE.BoxGeometry(0.42, 0.13, 0.2), new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.3 }), cars.length);
      const carTop = new THREE.InstancedMesh(new THREE.BoxGeometry(0.24, 0.09, 0.18), new THREE.MeshStandardMaterial({ color: 0x1d232b, roughness: 0.3, metalness: 0.4 }), cars.length);
      const carCols = [0x9aa3ad, 0x2e3a4a, 0xd8d8d4, 0x5b6470, 0x8a2f2a, 0x3c4a3a, 0x1f2328];
      cars.forEach((c, k) => {
        carBody.setColorAt(k, C(carCols[k % carCols.length]));
        dm.position.set(c.x, 0.1, c.z); dm.rotation.set(0, c.rot + c.ang, 0); dm.scale.set(1, 1, 1); dm.updateMatrix(); carBody.setMatrixAt(k, dm.matrix);
        dm.position.set(c.x - Math.cos(c.rot + c.ang) * 0.02, 0.2, c.z + Math.sin(c.rot + c.ang) * 0.02); dm.updateMatrix(); carTop.setMatrixAt(k, dm.matrix);
      });
      carBody.castShadow = carTop.castShadow = true; scene.add(carBody, carTop);
      const carBaseCol = cars.map((c, k) => C(carCols[k % carCols.length]));

      // ---------- glow points (street lamps, car lights, traffic lights) ----------
      function glowPoints(list, size) {
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(list.flatMap((p) => [p[0], p[1], p[2]]), 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(new Array(list.length * 3).fill(0), 3));
        const p = new THREE.Points(g, new THREE.PointsMaterial({ size, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, fog: true }));
        scene.add(p); return p;
      }
      const lamps = [];
      for (let k = 0; k <= N; k++) { const s = -HALF + k * P; for (let m = -HALF + 1.1; m < HALF; m += 2.2) { lamps.push([s + 0.62, 0.62, m, R(T.off0, T.off1)]); lamps.push([m, 0.62, s - 0.62, R(T.off0, T.off1)]); } }
      const lampPts = glowPoints(lamps, 1.1);
      const poleI = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.018, 0.022, 0.6, 5), new THREE.MeshStandardMaterial({ color: 0x3a3f45, roughness: 0.6 }), lamps.length);
      lamps.forEach((l, k) => { dm.position.set(l[0], 0.3, l[2]); dm.rotation.set(0, 0, 0); dm.scale.set(1, 1, 1); dm.updateMatrix(); poleI.setMatrixAt(k, dm.matrix); });
      poleI.castShadow = true; scene.add(poleI);

          d.a.legs.forEach((l, j) => { l.rotation.z = graze ? 0 : 0.45 * Math.sin(t * 7.5 + j * Math.PI * (j % 2 ? 1 : 0.5) + k); });
        });
        // dog alone by the stopped train line
        const dogT = t - 7.4; dog.g.visible = t > 7.0 && t < 12.0;
        dog.g.position.set(-0.6 + Math.min(Math.max(dogT, 0), 2.6) * 0.45, 0.0, TRAIN_Z + 0.85); dog.g.rotation.y = dogT > 2.6 ? 0.9 * Math.sin(dogT * 1.3) : 0;
        dog.legs.forEach((l, j) => { l.rotation.z = dogT > 0 && dogT < 2.6 ? 0.6 * Math.sin(t * 12 + j * 1.7) : 0; });

        // birds fly toward the sunrise
        const bv = sstep(T.sun0 + 1.0, T.sun0 + 2.0, t);
        for (let k = 0; k < birdN; k++) {
          const s = birdS[k]; const tt = t - T.sun0;
          dm.position.set(s[0] + Math.sin(tt * 0.3 + k) * 0.6, s[1] + Math.sin(tt * 0.5 + k) * 0.3, s[2] - tt * 1.6 * s[4]);
          dm.rotation.set(0, 0, 0); const fl = 0.5 + 0.5 * Math.sin(tt * 9 * s[4] + s[3]); dm.scale.set(bv * 1.2, bv * (0.3 + fl * 1.2), bv * 1.2); dm.updateMatrix(); birds.setMatrixAt(k, dm.matrix);
        }
        birds.instanceMatrix.needsUpdate = true; birds.visible = bv > 0.01;

        camAt(t);
        renderer.render(scene, camera);

        // ---- 2D finishing: tilt-shift miniature blur, vignette, grain ----
        g2.clearRect(0, 0, W, H);
        bg.clearRect(0, 0, W / 2, H / 2);
        bg.globalCompositeOperation = "source-over"; bg.filter = "blur(5px)"; bg.drawImage(gl, 0, 0, W / 2, H / 2); bg.filter = "none";
        const tsAmt = 1 - sstep(T.sun0, T.sun0 + 4, t) * 0.65;
        const mg = bg.createLinearGradient(0, 0, 0, H / 2);
        mg.addColorStop(0, `rgba(0,0,0,${0.95 * tsAmt})`); mg.addColorStop(0.3, "rgba(0,0,0,0)"); mg.addColorStop(0.62, "rgba(0,0,0,0)"); mg.addColorStop(1, `rgba(0,0,0,${0.9 * tsAmt})`);
        bg.globalCompositeOperation = "destination-in"; bg.fillStyle = mg; bg.fillRect(0, 0, W / 2, H / 2); bg.globalCompositeOperation = "source-over";
        g2.drawImage(blurC, 0, 0, W, H);
        const vg = g2.createRadialGradient(540, 900, 480, 540, 960, 1280); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, `rgba(0,0,0,${lerp(0.62, 0.42, sstep(T.sun0, T.sun1, t))})`);
        g2.fillStyle = vg; g2.fillRect(0, 0, W, H);
        // warm bloom from the sunrise
        const sb = sstep(T.sun0 + 1, T.sun1, t);
        if (sb > 0) { const rg = g2.createRadialGradient(560, 330, 0, 560, 330, 900); rg.addColorStop(0, `rgba(255,190,120,${0.32 * sb})`); rg.addColorStop(1, "rgba(255,190,120,0)"); g2.globalCompositeOperation = "screen"; g2.fillStyle = rg; g2.fillRect(0, 0, W, H); g2.globalCompositeOperation = "source-over"; }
        g2.globalAlpha = 0.045; const gt = grain[Math.floor(t * 24) % 4];
        for (let y = 0; y < H; y += 256) for (let x = 0; x < W; x += 256) g2.drawImage(gt, x, y);
        g2.globalAlpha = 1;
        // fade to black for the end card
        const fo = sstep(37.4, 38.4, t) * 0.38; if (fo > 0) { g2.fillStyle = `rgba(2,3,6,${fo})`; g2.fillRect(0, 0, W, H); }
        const fi = 1 - sstep(0, 0.5, t); if (fi > 0) { g2.fillStyle = `rgba(0,0,0,${fi})`; g2.fillRect(0, 0, W, H); }
      }

      let lastT = 0;
      renderAt(0);
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
      const tl = gsap.timeline({ paused: true }); tl.to({}, { duration: DUR }); window.__timelines["city"] = tl;
    })();
  </script>
