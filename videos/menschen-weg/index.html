<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root { --ground: #05080f; --ink: #ffffff; --font-display: "Inter", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1080" data-height="1920">
      <div id="city" data-composition-id="city" data-composition-src="compositions/city.html" data-start="0" data-duration="40"
        data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="overlays" data-composition-id="overlays" data-composition-src="compositions/overlays.html" data-start="0" data-duration="40"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="40"
        data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- Voice (ElevenLabs, Thomas) -->
      <audio id="a-voice" class="clip" src="assets/audio/voice.mp3" data-start="0.2" data-duration="37.25" data-track-index="10" data-volume="1"></audio>

      <!-- Mysterious bed and wind -->
      <audio id="a-bed-1" class="clip" src="assets/audio/drone.mp3" data-start="0" data-duration="30" data-track-index="11" data-volume="0.2" data-fade-in="0.6"></audio>
      <audio id="a-bed-2" class="clip" src="assets/audio/drone.mp3" data-start="30" data-duration="10" data-track-index="11" data-volume="0.16" data-fade-out="3"></audio>
      <audio id="a-wind-1" class="clip" src="assets/audio/wind.mp3" data-start="0" data-duration="20" data-track-index="12" data-volume="0.22" data-fade-in="1"></audio>
      <audio id="a-wind-2" class="clip" src="assets/audio/wind.mp3" data-start="20" data-duration="20" data-track-index="12" data-volume="0.2" data-fade-out="3"></audio>

      <!-- Sound design -->
      <audio id="a-sfx-00" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="0.2" data-duration="2.1" data-track-index="13" data-volume="0.3"></audio>
      <audio id="a-sfx-01" class="clip" src="assets/audio/whoosh1.mp3" data-start="3.3" data-duration="1.0" data-track-index="13" data-volume="0.16"></audio>
      <audio id="a-sfx-02" class="clip" src="assets/audio/whoosh2.mp3" data-start="11.3" data-duration="1.5" data-track-index="13" data-volume="0.16"></audio>
      <audio id="a-sfx-03" class="clip" src="assets/audio/whoosh1.mp3" data-start="16.0" data-duration="1.0" data-track-index="13" data-volume="0.14"></audio>
      <audio id="a-sfx-04" class="clip" src="assets/audio/metal.mp3" data-start="18.9" data-duration="5.0" data-track-index="14" data-volume="0.32"></audio>
      <audio id="a-sfx-05" class="clip" src="assets/audio/whoosh2.mp3" data-start="21.3" data-duration="1.5" data-track-index="13" data-volume="0.16"></audio>
      <audio id="a-sfx-06" class="clip" src="assets/audio/metal.mp3" data-start="25.8" data-duration="5.0" data-track-index="14" data-volume="0.4"></audio>
      <audio id="a-swell" class="clip" src="assets/audio/swell.mp3" data-start="30.8" data-duration="9.0" data-track-index="15" data-volume="0.55"></audio>
      <audio id="a-sfx-07" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="37.85" data-duration="2.1" data-track-index="13" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
